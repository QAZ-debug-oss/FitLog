<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FitLog"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>FitLog</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f5f5f5;background:#111}*{box-sizing:border-box}body{margin:0;padding-bottom:88px}main{max-width:680px;margin:auto;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#ff8b3d;font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:27px;margin:8px 0 18px}h2{font-size:20px;margin:0 0 12px}.hero{background:linear-gradient(135deg,#ff994b,#f66b27);color:#19110b;padding:22px;border-radius:22px;margin:15px 0}.hero h2{font-size:29px}.hero small{font-weight:700}.bar{background:#c55b24;height:8px;border-radius:9px;margin-top:14px;overflow:hidden}.bar span{display:block;height:100%;background:#201710}.card{background:#242426;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#a7a7ad;font-size:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.orange{color:#ff944a}.pill{background:#3b302a;border-radius:20px;padding:6px 10px;font-size:12px}.btn{background:#ff873d;color:#1a130e;border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#39393d;color:#f6f6f6}.btn.outline{background:transparent;color:#ff944a;border:1px solid #8a5738}.btn:disabled{opacity:.4}.btn.full{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}input,select{background:#333337;color:white;border:1px solid #49494e;border-radius:10px;padding:11px 8px;font-size:16px;max-width:100%}select{width:100%;margin:8px 0}input[type=number]{width:100%}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 62px;align-items:center;gap:9px;margin:9px 0}.setrow button{padding:12px 5px;border-radius:9px;border:1px solid #555;background:#36363a;color:white}.setrow button.done{background:#ff873d;color:#111;border-color:#ff873d}.sethead{font-size:11px;color:#999;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;border-top:1px solid #353538;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav>div{display:flex;width:100%;max-width:680px}.nav button{flex:1;background:none;color:#999;border:0;padding:14px 2px;font-size:12px}.nav button.active{color:#ff9348;font-weight:800}.hidden{display:none}.item{border-bottom:1px solid #3b3b3f;padding:12px 0}.item:last-child{border:0}.stat{background:#303034;padding:14px;border-radius:13px;flex:1;text-align:center}.stat strong{display:block;font-size:22px;color:#ff944a}.timer{font-size:38px;color:#ff944a;font-weight:800;font-variant-numeric:tabular-nums}.small{font-size:12px}textarea{width:100%;min-height:60px;background:#333;color:white;border:1px solid #555;border-radius:10px;padding:10px}.chart{width:100%;height:180px}.notice{font-size:12px;color:#b5b5b9;line-height:1.6}.demo-btn{margin:12px 0 8px;width:100%;background:#3a302b;border:1px solid #98603b;color:#ffa668;border-radius:12px;padding:12px;font-size:15px;font-weight:800}.demo-panel{background:#19191b;border:1px solid #49403a;border-radius:14px;padding:15px;margin:5px 0 14px;line-height:1.75}.demo-panel h3{color:#ff994d;margin:0 0 8px}.demo-panel p{margin:8px 0}.demo-panel .cue{color:#c6c6ca;font-size:13px}.demo-panel a{display:inline-block;color:#ffae78;margin-top:8px}.demo-panel[hidden]{display:none} .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calday{min-height:40px;background:#303034;color:#eee;border:1px solid #444;border-radius:8px;font-size:12px}.calday.marked{background:#69402b;border-color:#ff873d;color:#ffbd8b;font-weight:800}.calday:disabled{opacity:.2}.filterbtn{padding:7px 11px;background:#343438;color:#eee;border:1px solid #555;border-radius:18px}.filterbtn.selected{background:#ff873d;color:#1b120b}.pr{background:#473224;border:1px solid #ae6a36;border-radius:10px;padding:9px;margin:8px 0;color:#ffb37c}.mini{font-size:12px;color:#aaa}.fieldlabel{display:block;margin:10px 0 4px;color:#aaa;font-size:13px} </style></head><body><main><div class="top"><div class="eyebrow">FITLOG / TRAIN SMARTER</div><div style="font-size:25px">🏋️</div></div><h1>今天，练得更强。</h1><section id="today"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"></section><section id="metrics" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav"><div id="nav"></div></nav><script>
let PLANS=[{name:'胸＋三头',items:[['平板杠铃卧推',5,'6–10',180],['上斜杠铃卧推',4,'8–12',180],['双杠臂屈伸／器械推胸',4,'8–12',120],['蝴蝶机夹胸',4,'10–15',90],['绳索三头下压',4,'10–15',90]]},{name:'肩＋腹',items:[['站姿杠铃实力举',4,'6–10',180],['哑铃推肩',4,'8–12',150],['哑铃侧平举',4,'12–15',90],['绳索面拉',4,'12–15',90],['蝴蝶机后束',4,'12–15',90],['悬垂举腿',4,'10–15',75]]},{name:'背＋二头',items:[['辅助引体向上',4,'6–10',150],['高位下拉',4,'8–12',120],['对握高位下拉',4,'8–12',120],['坐姿划船',4,'8–12',120],['胸托划船',4,'10–12',120],['哑铃弯举',4,'10–12',90]]},{name:'腿部',items:[['史密斯深蹲',3,'5–8',180],['罗马尼亚硬拉',3,'8',150],['保加利亚分腿蹲',2,'8/侧',120],['髋内收机',2,'12–15',90],['站姿提踵',3,'10–15',90],['坐姿提踵',2,'12–20',90]]},{name:'休息日',items:[]}];
const DEMOS={
'助跑双脚摸高':['助跑 2–4 步，倒数第二步稍长，最后一步快速落地，双臂后摆再向上摆。双脚协同蹬地，伸髋、伸膝、踮脚，向最高点摸高。','每次全力起跳，落地时屈髋屈膝缓冲；组间休息 2–3 分钟。','不要为了追求次数而在疲劳状态下连续乱跳。'],
'原地反向纵跳':['双脚与肩同宽，站稳后快速下沉，手臂向后摆；立刻反向蹬地、摆臂向上跳。','下沉幅度自然，不必蹲到底；每次落地站稳再进行下一次。','避免膝盖内扣、落地僵硬。'],
'史密斯深蹲':['杠铃放在上背部，双脚放在能让下蹲自然的位置；吸气收紧核心，屈髋屈膝下蹲，再用全脚掌推地站起。','膝盖朝脚尖方向移动，下降到能稳定控制的深度。','不要脚跟离地、腰背失稳或强行蹲得过深。'],
'罗马尼亚硬拉':['双手握杠，膝盖微屈，臀部向后推，杠铃贴近双腿下移；感到大腿后侧拉伸后收臀站起。','保持脊柱自然稳定，重心落在全脚掌。','不是弯腰够地，也不要用腰部猛拉。'],
'保加利亚分腿蹲':['后脚脚背搭在长凳上，前脚踩稳；屈膝缓慢下降，前腿发力站起，两侧分别完成。','先徒手找到前后脚距离和身体平衡。','不要前膝明显内扣或靠后腿弹起。'],
'髋内收机':['坐稳并贴住靠背，把大腿置于腿垫内侧；控制双腿向中间夹紧，稍停，再缓慢打开。','选择能控制的重量，保持骨盆稳定。','不要用惯性猛夹或打开过度。'],
'站姿提踵':['前脚掌踩稳踏板，膝盖基本伸直；脚跟缓慢下降，再尽量抬高脚跟，顶端短暂停顿。','上下全程控制，不要借身体弹动。','不要只做很小的幅度。'],
'坐姿提踵':['坐姿屈膝约 90°，大腿放在腿垫下；前脚掌发力抬起脚跟，再慢慢下降。','顶端停顿，感受小腿深层发力。','不要反弹借力。'],
'平板杠铃卧推':['肩胛向后下收紧，双脚踩稳，杠铃有控制地下放至胸部附近，再向上推起。','手腕保持中立，杠铃路径稳定。','不要弹胸或抬臀。'],
'上斜杠铃卧推':['将卧推凳调至较小上斜角度，肩胛稳定，杠铃下放至上胸附近再推起。','避免肩膀耸起。','不要使用过大的倾斜角度。'],
'双杠臂屈伸／器械推胸':['双杠臂屈伸：身体略前倾，控制下降再推起；器械推胸：肩胛稳定，推柄向前推。','以肩部舒适的活动范围为准。','肩前侧疼痛时不要强撑。'],
'蝴蝶机夹胸':['调整座椅让把手与胸部大致齐平，手臂微屈，向前夹胸并控制回程。','胸部主动发力，肩膀不要前顶。','不要猛甩重量。'],
'绳索三头下压':['大臂贴近躯干，肘关节保持位置，向下伸直手臂，再慢慢还原。','控制回程，不要晃动身体。','不要用肩部和腰部借力。'],
'站姿杠铃实力举':['站稳、收紧核心，杠铃从上胸附近沿面前向上推至头顶，再控制下放。','顶端手臂伸直，避免腰部过度后仰。','不要蹬腿借力（实力举版本）。'],
'哑铃推肩':['坐姿或站姿，哑铃从肩侧向上推，控制下降。','肩胛自然上旋，动作范围以舒适为准。','不要猛撞哑铃或过度后仰。'],
'哑铃侧平举':['手肘微屈，哑铃沿身体两侧向上抬至肩高附近，再慢慢放下。','小重量控制，肩膀放松。','不要耸肩或甩腰。'],
'绳索面拉':['绳索调至面部高度，向额头附近拉，手肘向外打开，肩胛向后收。','动作缓慢，重视后肩和上背发力。','不要后仰借力。'],
'蝴蝶机后束':['面向器械坐稳，手臂略弯，向两侧打开，肩胛稳定。','感受三角肌后束发力。','不要用腰部摆动。'],
'悬垂举腿':['握住单杠，先稳定身体，卷起骨盆并抬腿，再控制下放。','可以先屈膝版本。','不要前后摆荡借力。'],
'辅助引体向上':['设置辅助重量，双手握杠，肩胛下沉，拉至下巴靠近横杠，再缓慢下降。','辅助越大越容易，优先保证动作幅度。','不要踢腿借力。'],
'高位下拉':['坐稳固定大腿，将握杆拉向上胸，肘部向身体两侧下方移动，控制还原。','躯干保持稳定。','不要猛然后仰。'],
'对握高位下拉':['使用对握把手，胸部挺起，将把手向上胸拉近，慢慢伸臂还原。','感受背阔肌发力。','不要只靠手臂拉。'],
'坐姿划船':['坐稳，背部自然挺直，先收肩胛，再将把手拉向腹部，控制向前伸展。','躯干轻微移动可以，但不要大幅摆动。','避免圆背猛拉。'],
'胸托划船':['胸部贴稳斜凳或器械胸垫，双臂向后拉，肘部沿合适轨迹移动。','避免借助腰背甩动。','不要耸肩。'],
'哑铃弯举':['手肘靠近躯干，弯曲肘部举起哑铃，再缓慢下放。','保持上臂稳定。','不要大幅摆腰。']};
function demoHtml(name){let d=DEMOS[name]||['保持动作稳定，在无痛范围内完成。','先用轻重量熟悉动作。','避免借力和动作失控。'];let q=encodeURIComponent(name+' 健身 动作教学');return `<button class="demo-btn" onclick="toggleDemo()">🎬 动作示范 / 要领 ▾</button><div class="demo-panel" id="demoPanel" hidden><h3>${esc(name)}</h3><p><b>① 动作步骤</b><br>${esc(d[0])}</p><p><b>② 关键提示</b><br>${esc(d[1])}</p><p class="cue"><b>⚠️ 常见错误</b><br>${esc(d[2])}</p><a target="_blank" rel="noopener noreferrer" href="https://search.bilibili.com/all?keyword=${q}">▶ B站教学 ↗</a>　<a target="_blank" rel="noopener noreferrer" href="https://www.douyin.com/search/${q}">▶ 抖音教学 ↗</a><p class="notice">视频链接需要网络；上方动作要领可离线查看。</p></div>`}
function toggleDemo(){let el=$('demoPanel');if(el)el.hidden=!el.hidden}
const DEFAULT={customNames:{},legPlanV3:false,day:0,exercise:0,sets:{},history:[],jumps:[],basketball:[],metrics:[],timerEnd:0,timerLeft:0,timerPaused:true,restOverrides:{},libraryCategory:"全部"};let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem('fitlog-v1')||'{}')}}catch(e){state={...DEFAULT}}// Keep existing leg-day set logs aligned when removing the second jump movement.
if(!state.legPlanV3){let migrated={};for(const [key,val] of Object.entries(state.sets||{})){let m=/^(w?3-)(\d+)$/.exec(key);if(m){let i=+m[2];if(i===1)continue;if(i>1){migrated[m[1]+(i-1)]=val;continue}}migrated[key]=val}state.sets=migrated;if(state.day===3&&state.exercise>1)state.exercise--;state.legPlanV3=true;localStorage.setItem('fitlog-v1',JSON.stringify(state))}
// A personal editable cycle, stored with the existing device-local FitLog data.
if(!Array.isArray(state.plans)||!state.plans.length){state.plans=JSON.parse(JSON.stringify(PLANS))}
if(!state.generalPlanV1){let leg=state.plans[3];if(leg&&leg.name==='腿＋弹跳'&&leg.items?.[0]?.[0]==='助跑双脚摸高'){leg.name='腿部';leg.items.shift();let moved={};for(let [k,v] of Object.entries(state.sets||{})){let mt=/^(w?3-)(\d+)$/.exec(k);if(mt){let ix=+mt[2];if(ix===0)continue;moved[mt[1]+(ix-1)]=v}else moved[k]=v}state.sets=moved;let names={};for(let [k,v] of Object.entries(state.customNames||{})){let mt=/^3-(\d+)$/.exec(k);if(mt){let ix=+mt[1];if(ix===0)continue;names['3-'+(ix-1)]=v}else names[k]=v}state.customNames=names;if(state.day===3)state.exercise=Math.max(0,state.exercise-1)}state.generalPlanV1=true;localStorage.setItem('fitlog-v1',JSON.stringify(state))}
PLANS=state.plans;
state.day=Math.min(Math.max(0,Number(state.day)||0),PLANS.length-1);
state.exercise=Math.min(Math.max(0,Number(state.exercise)||0),Math.max(0,PLANS[state.day].items.length-1));
let tab='today';function save(){localStorage.setItem('fitlog-v1',JSON.stringify(state))}const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function exerciseName(day,index){return state.customNames?.[day+'-'+index]||PLANS[day].items[index][0]}
function renameExercise(){let key=state.day+'-'+state.exercise,old=exerciseName(state.day,state.exercise);let name=prompt('修改动作名称',old);if(name===null)return;name=name.trim();if(!name)return alert('动作名称不能为空');if(name.length>60)return alert('名称请控制在 60 字以内');state.customNames=state.customNames||{};state.customNames[key]=name;save();render()}
function resetExerciseName(){let key=state.day+'-'+state.exercise;if(!state.customNames?.[key])return;delete state.customNames[key];save();render()}
function renameCycleDay(){let name=prompt('修改训练日名称',PLANS[state.day].name);if(name===null)return;name=name.trim();if(!name||name.length>30)return alert('请输入1–30字的训练日名称');PLANS[state.day].name=name;save();render()}
function cycleReorder(order){let oldPlans=PLANS.slice(),oldDay=state.day;let newPlans=order.map(i=>oldPlans[i]);let newSets={},newNames={};for(let ni=0;ni<order.length;ni++){let oi=order[ni];for(let [key,val] of Object.entries(state.sets||{})){let m=/^(w?)(\d+)-(\d+)$/.exec(key);if(m&&+m[2]===oi)newSets[m[1]+ni+'-'+m[3]]=val}for(let [key,val] of Object.entries(state.customNames||{})){let m=/^(\d+)-(\d+)$/.exec(key);if(m&&+m[1]===oi)newNames[ni+'-'+m[2]]=val}}state.sets=newSets;state.customNames=newNames;state.plans=newPlans;PLANS=state.plans;state.day=order.indexOf(oldDay);if(state.day<0){state.day=Math.min(oldDay,PLANS.length-1);state.exercise=0}else state.exercise=Math.min(state.exercise,Math.max(0,PLANS[state.day].items.length-1));save();render()}
function moveCycleDay(dir){let i=state.day,j=i+dir;if(j<0||j>=PLANS.length)return;let order=PLANS.map((_,k)=>k);[order[i],order[j]]=[order[j],order[i]];cycleReorder(order)}
function addCycleDay(){let name=prompt('新增训练日名称（例如：手臂＋核心）','新训练日');if(name===null)return;name=name.trim();if(!name||name.length>30)return alert('请输入1–30字的训练日名称');if(PLANS.length>=14)return alert('最多设置14个训练日');PLANS.push({name,items:[]});state.day=PLANS.length-1;state.exercise=0;save();render()}
function deleteCycleDay(){if(PLANS.length<=1)return alert('至少保留一个训练日');if(!confirm('删除当前训练日「'+PLANS[state.day].name+'」？该训练日未完成的组数记录也会删除，已完成的历史记录保留。'))return;cycleReorder(PLANS.map((_,i)=>i).filter(i=>i!==state.day))}
function addCycleExercise(){let name=prompt('新动作名称（例如：哑铃卧推）');if(name===null)return;name=name.trim();if(!name||name.length>60)return alert('请输入1–60字的动作名称');let count=prompt('默认正式组数（1–10）','3');if(count===null)return;count=Number(count);if(!Number.isInteger(count)||count<1||count>10)return alert('组数必须为1–10的整数');PLANS[state.day].items.push([name,count,'8–12',90]);state.exercise=PLANS[state.day].items.length-1;save();render()}
function removeCycleExercise(){let items=PLANS[state.day].items;if(!items.length)return;if(!confirm('删除「'+exerciseName(state.day,state.exercise)+'」？此动作尚未完成的组数记录会删除，历史记录不受影响。'))return;let d=state.day,removed=state.exercise;items.splice(removed,1);let newSets={};for(let [key,val] of Object.entries(state.sets||{})){let m=/^(w?)(\d+)-(\d+)$/.exec(key);if(m&&+m[2]===d){let ix=+m[3];if(ix===removed)continue;if(ix>removed){newSets[m[1]+d+'-'+(ix-1)]=val;continue}}newSets[key]=val}state.sets=newSets;let names={};for(let [key,val] of Object.entries(state.customNames||{})){let m=/^(\d+)-(\d+)$/.exec(key);if(m&&+m[1]===d){let ix=+m[2];if(ix===removed)continue;if(ix>removed){names[d+'-'+(ix-1)]=val;continue}}names[key]=val}state.customNames=names;state.exercise=Math.min(state.exercise,Math.max(0,items.length-1));save();render()}

['背','辅助引体向上',3,'6–10',150],['背','高位下拉',3,'8–12',100],['背','坐姿划船',3,'8–12',100],['背','单臂哑铃划船',3,'10–12',90],

function applyTemplate(){let choice=$('templateSelect')?.value;if(!PLAN_TEMPLATES[choice])return;if(!confirm('应用「'+choice+'」将替换当前训练循环，并清除未完成组数；已保存的历史、身体指标会保留。请先导出备份。确定继续？'))return;state.plans=JSON.parse(JSON.stringify(PLAN_TEMPLATES[choice]));PLANS=state.plans;state.day=0;state.exercise=0;state.sets={};state.customNames={};state.restOverrides={};save();render();alert('已应用训练模板')}
function renderLibrary(){let cat=state.libraryCategory||'全部';return `<div class="card"><h2>动作库 / EXERCISE LIBRARY</h2><p class="muted">按肌群筛选，添加到当前训练日。视频示范会根据动作名称搜索 B站或抖音。</p><div class="row" style="flex-wrap:wrap">${['全部','胸','背','肩','腿','手臂','核心'].map(c=>`<button class="filterbtn ${cat===c?'selected':''}" onclick="state.libraryCategory='${c}';save();render()">${c}</button>`).join('')}</div>${EXERCISE_LIBRARY.map((e,i)=>({e,i})).filter(x=>cat==='全部'||x.e[0]===cat).map(({e,i})=>`<div class="item line"><div><b>${esc(e[1])}</b><div class="mini">${esc(e[0])} · ${e[2]}组 × ${esc(e[3])}</div></div><button class="btn secondary" onclick="addFromLibrary(${i})">＋ 添加</button></div>`).join('')}</div>`}
function addFromLibrary(i){let e=EXERCISE_LIBRARY[i];if(!e)return;PLANS[state.day].items.push([e[1],e[2],e[3],e[4]]);state.exercise=PLANS[state.day].items.length-1;save();render();alert('已加入当前训练日：'+e[1])}
function previousSets(name){for(const h of state.history||[]){let item=(h.items||[]).find(x=>x.name===name&&x.sets?.some(s=>s.done));if(item)return item.sets.filter(x=>x.done).map(x=>({weight:x.weight??'',reps:x.reps??'',done:false}))}return []}
function fillPrevious(){let name=exerciseName(state.day,state.exercise),prior=previousSets(name);if(!prior.length)return alert('尚无这个动作的历史记录');let rows=currentRows();if(rows.some(x=>x.done)&&!confirm('已有完成组，是否只填充未完成的空白项？'))return;for(let i=0;i<Math.min(rows.length,prior.length);i++){if(rows[i].done)continue;if(rows[i].weight===''||rows[i].weight==null)rows[i].weight=prior[i].weight;if(rows[i].reps===''||rows[i].reps==null)rows[i].reps=prior[i].reps}save();render()}

function recordsFor(name){return (state.history||[]).slice().reverse().flatMap(h=>(h.items||[]).filter(it=>it.name===name).map(it=>{let s=(it.sets||[]).filter(x=>x.done&&Number(x.weight)>0&&Number(x.reps)>0);if(!s.length)return null;return {date:h.date,max:Math.max(...s.map(x=>Number(x.weight))),volume:s.reduce((n,x)=>n+Number(x.weight)*Number(x.reps),0),e1rm:Math.max(...s.map(x=>Number(x.weight)*(1+Number(x.reps)/30))),sets:s.length}}).filter(Boolean))}
function prFor(name){let a=recordsFor(name);if(!a.length)return null;return {weight:Math.max(...a.map(x=>x.max)),volume:Math.max(...a.map(x=>x.volume)),e1rm:Math.max(...a.map(x=>x.e1rm))}}
function renderCalendar(){let now=new Date(),year=Number(state.calYear??now.getFullYear()),month=Number(state.calMonth??now.getMonth());let first=new Date(year,month,1),count=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;let days=(state.history||[]).reduce((m,h)=>{let d=new Date(h.date),k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();(m[k]||(m[k]=[])).push(h);return m},{});let cells='';for(let i=0;i<offset;i++)cells+='<button class="calday" disabled></button>';for(let d=1;d<=count;d++){let key=year+'-'+month+'-'+d,n=days[key]?.length||0;cells+=`<button class="calday ${n?'marked':''}" onclick="showCalendarDay(${d})">${d}${n?' ●':''}</button>`}return `<div class="card"><div class="line"><h2>训练日历</h2><div class="row"><button class="btn secondary" onclick="shiftCalendar(-1)">‹</button><b>${year}年${month+1}月</b><button class="btn secondary" onclick="shiftCalendar(1)">›</button></div></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<span class="mini" style="text-align:center">${x}</span>`).join('')}${cells}</div><p class="notice">橙色标记表示当天有已保存的训练。点击日期查看记录。</p><div id="calDetail"></div></div>`}

function showCalendarDay(day){let now=new Date(),year=Number(state.calYear??now.getFullYear()),month=Number(state.calMonth??now.getMonth());let hits=(state.history||[]).filter(h=>{let d=new Date(h.date);return d.getFullYear()===year&&d.getMonth()===month&&d.getDate()===day});$('calDetail').innerHTML=`<div class="item"><b>${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}</b>${hits.length?hits.map(h=>`<p>${esc(h.name)} · ${(h.items||[]).reduce((n,x)=>n+(x.sets||[]).filter(s=>s.done).length,0)} 组</p>${(h.items||[]).map(x=>`<div class="mini">${esc(x.name)}：${(x.sets||[]).filter(s=>s.done).map(s=>esc(s.weight)+'kg×'+esc(s.reps)).join(' / ')||'未完成'}</div>`).join('')}`).join(''):'<p class="muted">当天没有已保存的训练。</p>'}</div>`}
function renderPR(){let names=[...new Set((state.history||[]).flatMap(h=>(h.items||[]).map(x=>x.name)))];return `<div class="card"><h2>个人最佳纪录 / PR</h2><p class="muted">根据已完成正式组自动计算；估算1RM仅供参考。</p>${names.map(name=>{let p=prFor(name);return p?`<div class="item"><b>${esc(name)}</b><div class="mini">最高重量 <b class="orange">${p.weight.toFixed(1)} kg</b> · 最高单次训练总量 ${p.volume.toFixed(0)} kg·次 · 估算1RM ${p.e1rm.toFixed(1)} kg</div></div>`:''}).join('')||'<p class="muted">完成训练后将显示个人纪录。</p>'}</div>`}
function currentRows(){let key=state.day+'-'+state.exercise,item=PLANS[state.day].items[state.exercise];return state.sets[key]||(state.sets[key]=Array.from({length:item[1]},()=>({weight:'',reps:'',done:false,warmup:false})))}function totalDone(){let d=0,t=0;PLANS[state.day].items.forEach((it,i)=>{let rows=state.sets[state.day+'-'+i]||Array.from({length:it[1]},()=>({done:false}));d+=rows.filter(x=>x.done).length;t+=rows.length});return[d,t]}
function drawNav(){let tabs=[['today','训练','🏋️'],['history','历史','📅'],['progress','成长','📈'],['metrics','指标','📏'],['settings','设置','⚙️']];$('nav').innerHTML=tabs.map(([id,name,icon])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${icon}<br>${name}</button>`).join('')};function switchTab(t){tab=t;['today','history','progress','metrics','settings'].forEach(id=>$(id).classList.toggle('hidden',id!==t));render()}
function renderToday(){let plan=PLANS[state.day],done=totalDone();let html=`<div class="hero"><small>DAY ${String(state.day+1).padStart(2,'0')} · TODAY'S WORKOUT</small><h2>${esc(plan.name)}</h2><div>${plan.items.length} 个动作 · 已完成 ${done[0]} / ${done[1]} 组</div><div class="bar"><span style="width:${done[1]?100*done[0]/done[1]:0}%"></span></div></div><div class="card"><div class="line"><h2>训练循环</h2><span class="pill">手动切换</span></div><select onchange="state.day=+this.value;state.exercise=0;save();render()">${PLANS.map((p,i)=>`<option value="${i}" ${state.day===i?'selected':''}>DAY ${String(i+1).padStart(2,'0')} · ${esc(p.name)}</option>`).join('')}</select><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn secondary" onclick="renameCycleDay()">✏️ 修改训练日名称</button><button class="btn secondary" onclick="moveCycleDay(-1)" ${state.day===0?'disabled':''}>↑ 前移</button><button class="btn secondary" onclick="moveCycleDay(1)" ${state.day===PLANS.length-1?'disabled':''}>↓ 后移</button></div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="btn outline" onclick="addCycleDay()">＋ 新增训练日</button><button class="btn outline" onclick="deleteCycleDay()">删除当前训练日</button></div><p class="notice">训练循环可自定义；顺序和名称仅保存在当前设备。修改前建议先在设置中导出备份。</p><button class="btn full secondary" onclick="addCycleExercise()">＋ 给当前训练日添加动作</button></div>`;

下一个动作 →</button></div><div class="card"><div class="line"><div><div class="muted">REST TIMER / 组间休息</div><div class="timer" id="timerText">00:00</div></div><button class="btn" id="timerBtn" onclick="pauseTimer()">${state.timerPaused?'▶ 继续':'⏸ 暂停'}</button></div><div class="row"><button class="btn secondary" onclick="adjustTimer(-30)">−30秒</button><button class="btn secondary" onclick="adjustTimer(30)">＋30秒</button><button class="btn outline" onclick="skipTimer()">跳过</button></div></div>`}else{html+='<div class="card">🌙 今天恢复体能，适当活动与休息。</div>'}html+=renderLibrary();html+=`<button class="btn full" onclick="finishDay()">完成今日安排 · 进入下一日 →</button>`;$('today').innerHTML=html;if(plan.items.length){drawWarmups();drawTimer()}}
function editSet(i,k,v){currentRows()[i][k]=v;save()}function toggleSet(i){let r=currentRows()[i];r.done=!r.done;if(r.done){let sec=restSeconds();state.timerEnd=Date.now()+sec*1000;state.timerLeft=sec;state.timerPaused=false;if(i+1<currentRows().length&&!currentRows()[i+1].weight)currentRows()[i+1].weight=r.weight}save();render()}function addSet(){currentRows().push({weight:currentRows().at(-1)?.weight||'',reps:'',done:false});save();render()}function removeSet(){if(currentRows().length>1)currentRows().pop();save();render()}function addWarmup(){let key='w'+state.day+'-'+state.exercise;(state.sets[key]||(state.sets[key]=[])).push({weight:'',reps:''});save();drawWarmups()}function drawWarmups(){let key='w'+state.day+'-'+state.exercise,rows=state.sets[key]||[];$('warmups').innerHTML=rows.map((r,i)=>`<div class="setrow"><span class="small">热${i+1}</span><input type="number" placeholder="kg" value="${esc(r.weight)}" onchange="warmEdit(${i},'weight',this.value)"><input type="number" placeholder="次数" value="${esc(r.reps)}" onchange="warmEdit(${i},'reps',this.value)"><button onclick="removeWarm(${i})">删除</button></div>`).join('')}function warmEdit(i,k,v){state.sets['w'+state.day+'-'+state.exercise][i][k]=v;save()}function removeWarm(i){state.sets['w'+state.day+'-'+state.exercise].splice(i,1);save();drawWarmups()}
function leftTime(){return state.timerPaused?state.timerLeft:Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000))}function drawTimer(){let e=$('timerText');if(e){let s=leftTime();e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}let b=$('timerBtn');if(b)b.textContent=state.timerPaused?'▶ 继续':'⏸ 暂停'}function pauseTimer(){if(state.timerPaused&&state.timerLeft<=0)return;if(state.timerPaused){state.timerEnd=Date.now()+state.timerLeft*1000;state.timerPaused=false}else{state.timerLeft=leftTime();state.timerPaused=true}save();drawTimer()}function adjustTimer(v){let s=Math.max(0,leftTime()+v);state.timerLeft=s;state.timerEnd=Date.now()+s*1000;save();drawTimer()}function skipTimer(){state.timerLeft=0;state.timerPaused=true;save();drawTimer()}
function finishDay(){let plan=PLANS[state.day],snapshot={id:Date.now(),date:new Date().toISOString(),day:state.day,name:plan.name,items:plan.items.map((it,i)=>({name:exerciseName(state.day,i),sets:JSON.parse(JSON.stringify(state.sets[state.day+'-'+i]||[])),warmups:JSON.parse(JSON.stringify(state.sets['w'+state.day+'-'+i]||[]))}))};if(!confirm('保存本日记录并进入下一训练日？'))return;state.history.unshift(snapshot);Object.keys(state.sets).forEach(k=>{if(k.startsWith(state.day+'-')||k.startsWith('w'+state.day+'-'))delete state.sets[k]});state.day=(state.day+1)%PLANS.length;state.exercise=0;save();render();switchTab('history')}
function renderHistory(){let h=renderCalendar()+`<h2>训练历史 / HISTORY</h2><p class="muted">完成今日安排后，训练数据会自动保存在这里。</p><div class="row"><div class="stat"><strong>${state.history.length}</strong><span class="small">累计训练日</span></div><div class="stat"><strong>${state.history.filter(x=>Date.now()-new Date(x.date).getTime()<7*86400000).length}</strong><span class="small">近7天</span></div></div>`;if(!state.history.length)h+='<div class="card">还没有历史记录。完成第一次训练后会显示在这里。</div>';state.history.forEach((r,i)=>{let sets=r.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);h+=`<div class="card"><div class="line"><div><div class="orange small">${new Date(r.date).toLocaleDateString('zh-CN')}</div><h2>${esc(r.name)}</h2><span class="muted">已完成 ${sets} 组</span></div><button class="btn secondary" onclick="toggleDetail(${i})">查看详情</button></div><div id="detail${i}" class="hidden">${r.items.map(x=>`<div class="item"><b>${esc(x.name)}</b>${x.sets.filter(s=>s.done).map(s=>`<div class="muted">${esc(s.weight||'自重')} kg · ${esc(s.reps||'—')} 次</div>`).join('')||'<div class="muted">未完成</div>'}</div>`).join('')}</div></div>`});$('history').innerHTML=h}function toggleDetail(i){$('detail'+i).classList.toggle('hidden')}
function renderProgress(){let names=[...new Set(state.history.flatMap(h=>h.items.map(i=>i.name)))];$('progress').innerHTML=`<h2>力量成长 / PROGRESS</h2><p class="muted">根据已完成正式组，查看每次训练的最高重量、训练总量和估算1RM。</p>${names.length?`<select id="progressExercise" onchange="drawProgress()">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><select id="progressMetric" onchange="drawProgress()"><option value="max">最高重量 (kg)</option><option value="volume">训练总量 (kg·次)</option><option value="e1rm">估算1RM (kg)</option></select><div id="progressChart" class="card"></div>`:'<div class="card">还没有数据。完成训练后将自动生成成长曲线。</div>'}`;if(names.length)drawProgress();$('progress').innerHTML+=renderPR()}function drawProgress(){let name=$('progressExercise')?.value,metric=$('progressMetric')?.value||'max',pts=recordsFor(name).map(p=>({date:new Date(p.date).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}),v:p[metric]}));let el=$('progressChart');if(!el)return;if(!pts.length){el.innerHTML='<p class="muted">尚无有效训练数据。</p>';return}let max=Math.max(...pts.map(x=>x.v)),min=Math.min(...pts.map(x=>x.v)),pad=Math.max((max-min)*.12,max*.05,1),lo=min-pad,hi=max+pad;let coords=pts.map((p,i)=>({x:pts.length===1?170:30+i*280/(pts.length-1),y:150-(p.v-lo)/(hi-lo)*115}));let unit=metric==='volume'?' kg·次':' kg';el.innerHTML=`<div class="line"><span class="muted">最新 ${pts.at(-1).v.toFixed(1)}${unit}</span><b class="orange">${pts.length} 次记录</b></div><svg class="chart" viewBox="0 0 340 180" role="img" aria-label="${esc(name)}训练趋势折线图"><line x1="20" y1="150" x2="325" y2="150" stroke="#777"/><polyline points="${coords.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#ff873d" stroke-width="3"/>${coords.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#ff873d"><title>${esc(pts[i].date)} ${pts[i].v.toFixed(1)}${unit}</title></circle>`).join('')}</svg><div class="line muted"><span>${esc(pts[0].date)}</span><span>${esc(pts.at(-1).date)}</span></div><p class="notice">估算1RM采用 Epley 公式，不等于实测最大力量。</p>`}
function metricId(){return $('metricSelect')?.value||''}
function addMetric(){let name=prompt('新增指标名称（例如：臂围、腰围、体重）','臂围');if(name===null)return;name=name.trim();if(!name||name.length>30)return alert('名称请控制在1–30字');let unit=prompt('单位（例如：cm、kg、%）','cm');if(unit===null)return;unit=unit.trim();if(unit.length>12)return alert('单位请控制在12字以内');state.metrics.push({id:String(Date.now())+Math.random().toString(36).slice(2),name,unit,records:[]});save();renderMetrics()}
function renameMetric(){let m=state.metrics.find(x=>x.id===metricId());if(!m)return;let n=prompt('修改指标名称',m.name);if(n===null)return;n=n.trim();if(!n||n.length>30)return alert('名称请控制在1–30字');let u=prompt('修改单位',m.unit);if(u===null)return;if(u.length>12)return alert('单位请控制在12字以内');m.name=n;m.unit=u.trim();save();renderMetrics(m.id)}
function deleteMetric(){let m=state.metrics.find(x=>x.id===metricId());if(!m||!confirm('删除「'+m.name+'」及其全部测量记录？此操作无法撤销。'))return;state.metrics=state.metrics.filter(x=>x!==m);save();renderMetrics()}
function addMetricRecord(){let m=state.metrics.find(x=>x.id===metricId());if(!m)return;let raw=$('metricValue').value.trim(),val=Number(raw),date=$('metricDate').value;if(!raw||!Number.isFinite(val)||Math.abs(val)>1000000)return alert('请输入有效的数值');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))return alert('请选择有效日期');m.records.push({id:String(Date.now())+Math.random().toString(36).slice(2),date,value:val});save();renderMetrics(m.id)}
function deleteMetricRecord(id){let m=state.metrics.find(x=>x.id===metricId());if(!m||!confirm('删除这条测量记录？'))return;m.records=m.records.filter(x=>x.id!==id);save();renderMetrics(m.id)}
function renderMetrics(selected){let root=$('metrics');let items=state.metrics||[];let id=selected||root.querySelector('#metricSelect')?.value||items[0]?.id;let m=items.find(x=>x.id===id)||items[0];let h='<h2>身体指标 / TRACKER</h2><p class="muted">自由创建记录项目，如臂围、腰围、体重、体脂率等。每次测量都会保存，并自动生成折线图。</p><button class="btn full" onclick="addMetric()">＋ 新增自定义指标</button>';
if(m){let records=[...(m.records||[])].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));h+=`<div class="card"><label class="muted">选择指标</label><select id="metricSelect" onchange="renderMetrics(this.value)">${items.map(x=>`<option value="${esc(x.id)}" ${x.id===m.id?'selected':''}>${esc(x.name)} (${esc(x.unit||'无单位')})</option>`).join('')}</select><div class="row" style="flex-wrap:wrap"><button class="btn secondary" onclick="renameMetric()">✏️ 修改指标</button><button class="btn outline" onclick="deleteMetric()">删除指标</button></div><h2 style="margin-top:20px">新增测量</h2><div class="row"><input id="metricDate" aria-label="测量日期" type="date" value="${new Date().toLocaleDateString('en-CA')}" style="width:55%"><input id="metricValue" aria-label="测量数值" type="number" step="any" placeholder="${esc(m.unit||'数值')}" style="width:45%"></div><button class="btn full" onclick="addMetricRecord()">保存本次记录</button></div><div class="card"><h2>${esc(m.name)} · 趋势折线图</h2><div id="metricChart"></div></div><div class="card"><h2>测量历史 (${records.length})</h2>${records.length?records.slice().reverse().map(x=>`<div class="item line"><div><b>${esc(x.value)} ${esc(m.unit)}</b><div class="muted">${esc(x.date)}</div></div><button class="btn outline" onclick="deleteMetricRecord('${esc(x.id)}')">删除</button></div>`).join(''):'<p class="muted">还没有记录，添加第一条测量后会生成曲线。</p>'}</div>`}else h+='<div class="card muted">还没有指标。点击上方按钮，创建你的第一个记录项目。</div>';root.innerHTML=h;if(m)drawMetricChart(m)}
function drawMetricChart(m){let el=$('metricChart'),pts=[...(m.records||[])].filter(x=>Number.isFinite(Number(x.value))).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));if(!pts.length){el.innerHTML='<p class="muted">记录数据后自动绘制趋势。</p>';return}let vals=pts.map(x=>Number(x.value)),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*.15,Math.abs(hi)*.02,.5);lo-=pad;hi+=pad;let n=pts.length,coords=pts.map((x,i)=>({x:n===1?170:30+i*280/(n-1),y:145-(Number(x.value)-lo)/(hi-lo)*110}));el.innerHTML=`<div class="line"><span class="muted">共 ${n} 次记录</span><b class="orange">最新 ${esc(vals.at(-1))} ${esc(m.unit)}</b></div><svg class="chart" viewBox="0 0 340 180" role="img" aria-label="${esc(m.name)}测量趋势折线图"><line x1="20" y1="145" x2="325" y2="145" stroke="#666"/><polyline points="${coords.map(x=>x.x+','+x.y).join(' ')}" fill="none" stroke="#ff873d" stroke-width="3" stroke-linejoin="round"/>${coords.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#ff873d"><title>${esc(pts[i].date)}：${esc(vals[i])} ${esc(m.unit)}</title></circle>`).join('')}</svg><div class="line muted"><span>${esc(pts[0].date)}</span><span>${esc(pts.at(-1).date)}</span></div><p class="notice">按测量日期顺序连接每条记录；同一天多次记录也会保留。</p>`}
function renderSettings(){$('settings').innerHTML=`<h2>设置 / SETTINGS</h2><div class="card"><h2>训练计划模板</h2><p class="muted">适合初步建立训练循环。应用模板会覆盖当前训练日安排和未完成组数，不会删除历史记录或身体指标；请先备份。</p><select id="templateSelect">${Object.keys(PLAN_TEMPLATES).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><button class="btn full" onclick="applyTemplate()">应用选中的训练模板</button></div><div class="card"><h2>数据备份</h2><p class="muted">数据仅保存在当前设备浏览器本地。清理网站数据或卸载后可能丢失，请定期导出。</p><button class="btn full" onclick="exportData()">导出 JSON 备份</button><label class="btn secondary full" style="display:block;text-align:center;margin-top:10px">导入 JSON 备份<input style="display:none" type="file" accept="application/json,.json" onchange="importData(this)"></label></div><div class="card"><h2>🧡 支持 FitLog</h2><p style="font-weight:800;color:#ff994b">健身的进步，不应该被 VIP 和付费门槛限制。</p><p class="notice">创建 FitLog 的初心很简单：让每一个热爱健身的人，都能免费、完整地记录训练，见证成长。不设 VIP，不锁核心功能。</p><p class="muted">自愿支持金额（最低 ¥0.10；实际付款时自行填写）</p><div class="row" style="flex-wrap:wrap">${['0.10','1','5','10','20'].map(v=>`<button class="btn secondary" onclick="document.getElementById('supportAmount').value='${v}'">¥${v}</button>`).join('')}</div><label class="fieldlabel" for="supportAmount">自定义金额（元）</label><input id="supportAmount" type="number" min="0.1" step="0.01" value="1" inputmode="decimal"><p class="notice">选择金额仅用于参考；个人收款码无法自动带入金额，也不会自动确认付款。无论是否支持，所有功能始终免费。</p><div class="row" style="margin-top:12px"><button class="btn secondary" style="flex:1" onclick="showSupportQR('alipay')">支付宝收款码</button><button class="btn secondary" style="flex:1" onclick="showSupportQR('wechat')">微信收款码</button></div><div id="supportQR" style="margin-top:12px"></div><p class="notice" style="text-align:center">独立开发，维护不易。感谢每一份支持与鼓励。🧡</p></div><div class="card"><h2>💬 意见与建议</h2><p class="notice">欢迎反馈问题或提出功能建议。反馈通过 GitHub Issues 提交，需要 GitHub 账号；目前尚未接入免登录的在线留言系统。</p><select id="feedbackType"><option>功能建议</option><option>问题反馈</option><option>其他留言</option></select><textarea id="feedbackText" placeholder="写下你的想法……"></textarea><button class="btn full" onclick="sendFitlogFeedback()">打开反馈提交页面</button></div><div class="card"><h2>使用说明</h2><p class="notice">训练日手动切换；完成组数会自动保存；点击「完成今日安排」后生成历史记录。计时器支持暂停和继续；动作名称可在训练页面单独修改并保存。浏览器后台提醒、振动及声音受设备限制。训练循环可修改名称、顺序、增删训练日与动作；训练计划为参考模板，可根据恢复情况调整。身体指标可以自行创建、记录和查看折线趋势。</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FitLog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.history)||!data.sets)throw Error('格式错误');if(confirm('导入将覆盖当前设备的 FitLog 记录，继续吗？')){state={...DEFAULT,...data};state.metrics=Array.isArray(state.metrics)?state.metrics:[];state.plans=Array.isArray(state.plans)&&state.plans.length?state.plans:JSON.parse(JSON.stringify(PLANS));PLANS=state.plans;state.day=Math.min(Math.max(0,+state.day||0),PLANS.length-1);state.exercise=Math.min(Math.max(0,+state.exercise||0),Math.max(0,PLANS[state.day].items.length-1));save();render();alert('导入成功')}}catch(e){alert('备份文件无效')}};reader.readAsText(f)}function showSupportQR(which){let map={alipay:['支付宝','alipay-qr.jpg'],wechat:['微信','wechat-qr.jpg']};let x=map[which];if(!x)return;document.getElementById('supportQR').innerHTML=`<div style="text-align:center"><b>${x[0]}收款码</b><img src="${x[1]}" alt="${x[0]}收款二维码" style="display:block;width:100%;max-width:310px;margin:12px auto;border-radius:12px"><a class="btn secondary" style="display:inline-block;text-decoration:none" href="${x[1]}" download>保存收款码图片</a><p class="notice">请在${x[0]}中识别二维码并核对收款账户；金额需自行填写。</p></div>`}function sendFitlogFeedback(){let body=document.getElementById('feedbackText').value.trim();if(!body)return alert('请先填写反馈内容');let kind=document.getElementById('feedbackType').value;let url='https://github.com/QAZ-debug-oss/FitLog/issues/new?title='+encodeURIComponent('[FitLog] '+kind)+'&body='+encodeURIComponent(body);window.open(url,'_blank','noopener,noreferrer')}function render(){drawNav();renderToday();renderHistory();renderProgress();renderMetrics();renderSettings()}render();setInterval(()=>{drawTimer();if(!state.timerPaused&&leftTime()===0){state.timerPaused=true;state.timerLeft=0;save();if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
