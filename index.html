<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FitLog"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>FitLog</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f5f5f5;background:#111}*{box-sizing:border-box}body{margin:0;padding-bottom:88px}main{max-width:680px;margin:auto;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#ff8b3d;font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:27px;margin:8px 0 18px}h2{font-size:20px;margin:0 0 12px}.hero{background:linear-gradient(135deg,#ff994b,#f66b27);color:#19110b;padding:22px;border-radius:22px;margin:15px 0}.hero h2{font-size:29px}.hero small{font-weight:700}.bar{background:#c55b24;height:8px;border-radius:9px;margin-top:14px;overflow:hidden}.bar span{display:block;height:100%;background:#201710}.card{background:#242426;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#a7a7ad;font-size:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.orange{color:#ff944a}.pill{background:#3b302a;border-radius:20px;padding:6px 10px;font-size:12px}.btn{background:#ff873d;color:#1a130e;border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#39393d;color:#f6f6f6}.btn.outline{background:transparent;color:#ff944a;border:1px solid #8a5738}.btn:disabled{opacity:.4}.btn.full{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}input,select{background:#333337;color:white;border:1px solid #49494e;border-radius:10px;padding:11px 8px;font-size:16px;max-width:100%}select{width:100%;margin:8px 0}input[type=number]{width:100%}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 62px;align-items:center;gap:9px;margin:9px 0}.setrow button{padding:12px 5px;border-radius:9px;border:1px solid #555;background:#36363a;color:white}.setrow button.done{background:#ff873d;color:#111;border-color:#ff873d}.sethead{font-size:11px;color:#999;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;border-top:1px solid #353538;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav>div{display:flex;width:100%;max-width:680px}.nav button{flex:1;background:none;color:#999;border:0;padding:14px 2px;font-size:12px}.nav button.active{color:#ff9348;font-weight:800}.hidden{display:none}.item{border-bottom:1px solid #3b3b3f;padding:12px 0}.item:last-child{border:0}.stat{background:#303034;padding:14px;border-radius:13px;flex:1;text-align:center}.stat strong{display:block;font-size:22px;color:#ff944a}.timer{font-size:38px;color:#ff944a;font-weight:800;font-variant-numeric:tabular-nums}.small{font-size:12px}textarea{width:100%;min-height:60px;background:#333;color:white;border:1px solid #555;border-radius:10px;padding:10px}.chart{width:100%;height:180px}.notice{font-size:12px;color:#b5b5b9;line-height:1.6}</style></head><body><main><div class="top"><div class="eyebrow">FITLOG / TRAIN SMARTER</div><div style="font-size:25px">🏋️</div></div><h1>今天，练得更强。</h1><section id="today"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"></section><section id="jump" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav"><div id="nav"></div></nav><script>
const PLANS=[{name:'胸＋三头',items:[['平板杠铃卧推',5,'6–10',180],['上斜杠铃卧推',4,'8–12',180],['双杠臂屈伸／器械推胸',4,'8–12',120],['蝴蝶机夹胸',4,'10–15',90],['绳索三头下压',4,'10–15',90]]},{name:'肩＋腹',items:[['站姿杠铃实力举',4,'6–10',180],['哑铃推肩',4,'8–12',150],['哑铃侧平举',4,'12–15',90],['绳索面拉',4,'12–15',90],['蝴蝶机后束',4,'12–15',90],['悬垂举腿',4,'10–15',75]]},{name:'背＋二头',items:[['辅助引体向上',4,'6–10',150],['高位下拉',4,'8–12',120],['对握高位下拉',4,'8–12',120],['坐姿划船',4,'8–12',120],['胸托划船',4,'10–12',120],['哑铃弯举',4,'10–12',90]]},{name:'腿＋弹跳',items:[['助跑双脚摸高',3,'3',180],['原地反向纵跳',3,'3',180],['史密斯深蹲',3,'5–8',180],['罗马尼亚硬拉',3,'8',150],['保加利亚分腿蹲',2,'8/侧',120],['髋内收机',2,'12–15',90],['站姿提踵',3,'10–15',90],['坐姿提踵',2,'12–20',90]]},{name:'休息日',items:[]}];
const DEFAULT={day:0,exercise:0,sets:{},history:[],jumps:[],basketball:[],timerEnd:0,timerLeft:0,timerPaused:true};let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem('fitlog-v1')||'{}')}}catch(e){state={...DEFAULT}}let tab='today';function save(){localStorage.setItem('fitlog-v1',JSON.stringify(state))}const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function currentRows(){let key=state.day+'-'+state.exercise,item=PLANS[state.day].items[state.exercise];return state.sets[key]||(state.sets[key]=Array.from({length:item[1]},()=>({weight:'',reps:'',done:false,warmup:false})))}function totalDone(){let d=0,t=0;PLANS[state.day].items.forEach((it,i)=>{let rows=state.sets[state.day+'-'+i]||Array.from({length:it[1]},()=>({done:false}));d+=rows.filter(x=>x.done).length;t+=rows.length});return[d,t]}
function drawNav(){let tabs=[['today','训练','🏋️'],['history','历史','📅'],['progress','成长','📈'],['jump','弹跳','🏀'],['settings','设置','⚙️']];$('nav').innerHTML=tabs.map(([id,name,icon])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${icon}<br>${name}</button>`).join('')};function switchTab(t){tab=t;['today','history','progress','jump','settings'].forEach(id=>$(id).classList.toggle('hidden',id!==t));render()}
function renderToday(){let plan=PLANS[state.day],done=totalDone();let html=`<div class="hero"><small>DAY 0${state.day+1} · TODAY'S WORKOUT</small><h2>${plan.name}</h2><div>${plan.items.length} 个动作 · 已完成 ${done[0]} / ${done[1]} 组</div><div class="bar"><span style="width:${done[1]?100*done[0]/done[1]:0}%"></span></div></div><div class="card"><div class="line"><h2>训练循环</h2><span class="pill">手动切换</span></div><select onchange="state.day=+this.value;state.exercise=0;save();render()">${PLANS.map((p,i)=>`<option value="${i}" ${state.day===i?'selected':''}>DAY 0${i+1} · ${p.name}</option>`).join('')}</select></div>`;
if(plan.items.length){let it=plan.items[state.exercise],rows=currentRows();html+=`<div class="card"><div class="line"><h2>动作记录</h2><span class="muted">${state.exercise+1}/${plan.items.length}</span></div><select onchange="state.exercise=+this.value;save();render()">${plan.items.map((x,i)=>`<option value="${i}" ${i===state.exercise?'selected':''}>${i+1}. ${esc(x[0])}</option>`).join('')}</select><div class="muted">${it[2]} 次/组 · 默认休息 ${it[3]} 秒 · 正式组</div><div class="setrow sethead"><div>组</div><div>重量 kg</div><div>次数</div><div>完成</div></div>${rows.map((r,i)=>`<div class="setrow"><strong>${i+1}</strong><input aria-label="第${i+1}组重量" type="number" min="0" step="0.5" value="${esc(r.weight)}" onchange="editSet(${i},'weight',this.value)"><input aria-label="第${i+1}组次数" type="number" min="0" step="1" value="${esc(r.reps)}" onchange="editSet(${i},'reps',this.value)"><button class="${r.done?'done':''}" onclick="toggleSet(${i})">${r.done?'✓':'○'}</button></div>`).join('')}<div class="row"><button class="btn secondary" onclick="addSet()">＋ 增加组</button><button class="btn secondary" onclick="removeSet()">－ 减少组</button><button class="btn outline" onclick="addWarmup()">热身组</button></div><p class="notice">热身组单独记录，不计入正式组进度。</p><div id="warmups"></div><button class="btn full secondary" onclick="state.exercise=(state.exercise+1)%PLANS[state.day].items.length;save();render()">下一个动作 →</button></div><div class="card"><div class="line"><div><div class="muted">REST TIMER / 组间休息</div><div class="timer" id="timerText">00:00</div></div><button class="btn" id="timerBtn" onclick="pauseTimer()">暂停/继续</button></div><div class="row"><button class="btn secondary" onclick="adjustTimer(-30)">−30秒</button><button class="btn secondary" onclick="adjustTimer(30)">＋30秒</button><button class="btn outline" onclick="skipTimer()">跳过</button></div></div>`}else{html+='<div class="card">🌙 今天恢复体能，适当活动与休息。</div>'}html+=`<button class="btn full" onclick="finishDay()">完成今日安排 · 进入下一日 →</button>`;$('today').innerHTML=html;if(plan.items.length){drawWarmups();drawTimer()}}
function editSet(i,k,v){currentRows()[i][k]=v;save()}function toggleSet(i){let r=currentRows()[i];r.done=!r.done;if(r.done){let sec=PLANS[state.day].items[state.exercise][3];state.timerEnd=Date.now()+sec*1000;state.timerLeft=sec;state.timerPaused=false;if(i+1<currentRows().length&&!currentRows()[i+1].weight)currentRows()[i+1].weight=r.weight}save();render()}function addSet(){currentRows().push({weight:currentRows().at(-1)?.weight||'',reps:'',done:false});save();render()}function removeSet(){if(currentRows().length>1)currentRows().pop();save();render()}function addWarmup(){let key='w'+state.day+'-'+state.exercise;(state.sets[key]||(state.sets[key]=[])).push({weight:'',reps:''});save();drawWarmups()}function drawWarmups(){let key='w'+state.day+'-'+state.exercise,rows=state.sets[key]||[];$('warmups').innerHTML=rows.map((r,i)=>`<div class="setrow"><span class="small">热${i+1}</span><input type="number" placeholder="kg" value="${esc(r.weight)}" onchange="warmEdit(${i},'weight',this.value)"><input type="number" placeholder="次数" value="${esc(r.reps)}" onchange="warmEdit(${i},'reps',this.value)"><button onclick="removeWarm(${i})">删除</button></div>`).join('')}function warmEdit(i,k,v){state.sets['w'+state.day+'-'+state.exercise][i][k]=v;save()}function removeWarm(i){state.sets['w'+state.day+'-'+state.exercise].splice(i,1);save();drawWarmups()}
function leftTime(){return state.timerPaused?state.timerLeft:Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000))}function drawTimer(){let e=$('timerText');if(e){let s=leftTime();e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}function pauseTimer(){if(state.timerPaused){state.timerEnd=Date.now()+state.timerLeft*1000;state.timerPaused=false}else{state.timerLeft=leftTime();state.timerPaused=true}save();drawTimer()}function adjustTimer(v){let s=Math.max(0,leftTime()+v);state.timerLeft=s;state.timerEnd=Date.now()+s*1000;save();drawTimer()}function skipTimer(){state.timerLeft=0;state.timerPaused=true;save();drawTimer()}
function finishDay(){let plan=PLANS[state.day],snapshot={id:Date.now(),date:new Date().toISOString(),day:state.day,name:plan.name,items:plan.items.map((it,i)=>({name:it[0],sets:JSON.parse(JSON.stringify(state.sets[state.day+'-'+i]||[])),warmups:JSON.parse(JSON.stringify(state.sets['w'+state.day+'-'+i]||[]))}))};if(!confirm('保存本日记录并进入下一训练日？'))return;state.history.unshift(snapshot);Object.keys(state.sets).forEach(k=>{if(k.startsWith(state.day+'-')||k.startsWith('w'+state.day+'-'))delete state.sets[k]});state.day=(state.day+1)%5;state.exercise=0;save();render();switchTab('history')}
function renderHistory(){let h=`<h2>训练历史 / HISTORY</h2><p class="muted">完成今日安排后，训练数据会自动保存在这里。</p><div class="row"><div class="stat"><strong>${state.history.length}</strong><span class="small">累计训练日</span></div><div class="stat"><strong>${state.history.filter(x=>Date.now()-new Date(x.date).getTime()<7*86400000).length}</strong><span class="small">近7天</span></div></div>`;if(!state.history.length)h+='<div class="card">还没有历史记录。完成第一次训练后会显示在这里。</div>';state.history.forEach((r,i)=>{let sets=r.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);h+=`<div class="card"><div class="line"><div><div class="orange small">${new Date(r.date).toLocaleDateString('zh-CN')}</div><h2>${esc(r.name)}</h2><span class="muted">已完成 ${sets} 组</span></div><button class="btn secondary" onclick="toggleDetail(${i})">查看详情</button></div><div id="detail${i}" class="hidden">${r.items.map(x=>`<div class="item"><b>${esc(x.name)}</b>${x.sets.filter(s=>s.done).map(s=>`<div class="muted">${esc(s.weight||'自重')} kg · ${esc(s.reps||'—')} 次</div>`).join('')||'<div class="muted">未完成</div>'}</div>`).join('')}</div></div>`});$('history').innerHTML=h}function toggleDetail(i){$('detail'+i).classList.toggle('hidden')}
function renderProgress(){let names=[...new Set(state.history.flatMap(h=>h.items.map(i=>i.name)))];$('progress').innerHTML=`<h2>力量成长 / PROGRESS</h2><p class="muted">根据真实完成的正式组，显示每次训练最高重量。</p>${names.length?`<select id="progressExercise" onchange="drawProgress()">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div id="progressChart" class="card"></div>`:'<div class="card">还没有数据。完成训练后将自动生成成长曲线。</div>'}`;if(names.length)drawProgress()}function drawProgress(){let name=$('progressExercise').value,pts=state.history.slice().reverse().map(h=>{let it=h.items.find(x=>x.name===name);let weights=(it?.sets||[]).filter(x=>x.done&&x.weight!=='').map(x=>Number(x.weight)).filter(Number.isFinite);return weights.length?{date:new Date(h.date).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}),v:Math.max(...weights)}:null}).filter(Boolean);if(!pts.length){$('progressChart').innerHTML='尚无有效重量记录';return}let max=Math.max(...pts.map(x=>x.v),1),min=Math.min(...pts.map(x=>x.v),0),range=Math.max(max-min,5);let coords=pts.map((p,i)=>`${30+(pts.length===1?140:i*280/(pts.length-1))},${150-(p.v-min)/range*115}`).join(' ');$('progressChart').innerHTML=`<div class="line"><div class="muted">最新 ${pts.at(-1).v} kg</div><b class="orange">${pts.at(-1).v-pts[0].v>=0?'+':''}${(pts.at(-1).v-pts[0].v).toFixed(1)} kg</b></div><svg class="chart" viewBox="0 0 340 180" role="img" aria-label="训练最高重量折线图"><line x1="20" y1="150" x2="325" y2="150" stroke="#777"/><polyline points="${coords}" fill="none" stroke="#ff873d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>{let x=30+(pts.length===1?140:i*280/(pts.length-1)),y=150-(p.v-min)/range*115;return `<circle cx="${x}" cy="${y}" r="4" fill="#ff873d"/><text x="${x}" y="${y-10}" font-size="10" text-anchor="middle" fill="white">${p.v}</text>`}).join('')}</svg><div class="muted">${pts.length} 次有重量记录的训练 · 单位 kg</div>`}
function renderJump(){$('jump').innerHTML=`<h2>JUMP LAB / 双脚弹跳</h2><div class="card"><div class="line"><span class="muted">身高</span><b>182 cm</b></div><div class="line"><span class="muted">主要起跳方式</span><b class="orange">双脚</b></div><div class="line"><span class="muted">当前参考</span><b>篮板下沿附近</b></div><div class="line"><span class="muted">目标</span><b>摸筐 → 扣篮</b></div></div><div class="card"><h2>记录摸高</h2><label class="muted">站立摸高（cm）</label><input id="reach" type="number" placeholder="尚未测量"><br><br><label class="muted">助跑摸高（cm）</label><input id="touch" type="number" placeholder="尚未测量"><button class="btn full" onclick="saveJump()">保存测量</button><p class="notice">只有实际测量后才计算弹跳高度；不使用篮板位置估算值作为成绩。</p></div><h2>摸高历史</h2>${state.jumps.map(x=>`<div class="card line"><div>${new Date(x.date).toLocaleDateString('zh-CN')}<div class="muted">站立 ${x.reach} cm · 助跑 ${x.touch} cm</div></div><b class="orange">弹跳 ${(+x.touch- +x.reach).toFixed(1)} cm</b></div>`).join('')||'<div class="card muted">暂无测量记录</div>'}<div class="card"><h2>篮球训练</h2><select id="ballType"><option>运球投篮</option><option>半场对抗</option><option>摸高训练</option></select><input id="ballMinutes" type="number" placeholder="时长（分钟）"><button class="btn full secondary" onclick="saveBall()">记录篮球训练</button>${state.basketball.slice(0,5).map(x=>`<div class="item muted">${new Date(x.date).toLocaleDateString('zh-CN')} · ${esc(x.type)} · ${x.minutes} 分钟</div>`).join('')}</div>`}function saveJump(){let r=+$('reach').value,t=+$('touch').value;if(!(r>0&&t>r&&t<450))return alert('请填写有效的站立摸高和助跑摸高');state.jumps.unshift({date:new Date().toISOString(),reach:r,touch:t});save();renderJump()}function saveBall(){let m=+$('ballMinutes').value;if(!(m>0&&m<1000))return alert('请输入训练分钟数');state.basketball.unshift({date:new Date().toISOString(),type:$('ballType').value,minutes:m});save();renderJump()}
function renderSettings(){$('settings').innerHTML=`<h2>设置 / SETTINGS</h2><div class="card"><h2>数据备份</h2><p class="muted">数据仅保存在当前设备浏览器本地。清理网站数据或卸载后可能丢失，请定期导出。</p><button class="btn full" onclick="exportData()">导出 JSON 备份</button><label class="btn secondary full" style="display:block;text-align:center;margin-top:10px">导入 JSON 备份<input style="display:none" type="file" accept="application/json,.json" onchange="importData(this)"></label></div><div class="card"><h2>使用说明</h2><p class="notice">训练日手动切换；完成组数会自动保存；点击「完成今日安排」后生成历史记录。计时器在页面重新打开后会根据结束时间恢复。浏览器后台提醒、振动及声音受设备限制。训练计划为参考模板，可根据恢复情况调整。</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FitLog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.history)||!Array.isArray(data.jumps)||!data.sets)throw Error('格式错误');if(confirm('导入将覆盖当前设备的 FitLog 记录，继续吗？')){state={...DEFAULT,...data};save();render();alert('导入成功')}}catch(e){alert('备份文件无效')}};reader.readAsText(f)}function render(){drawNav();renderToday();renderHistory();renderProgress();renderJump();renderSettings()}render();setInterval(()=>{drawTimer();if(!state.timerPaused&&leftTime()===0){state.timerPaused=true;state.timerLeft=0;save();if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
