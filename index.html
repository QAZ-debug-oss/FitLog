<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FitLog"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>FitLog</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f5f5f5;background:#111}*{box-sizing:border-box}body{margin:0;padding-bottom:88px}main{max-width:680px;margin:auto;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#ff8b3d;font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:27px;margin:8px 0 18px}h2{font-size:20px;margin:0 0 12px}.hero{background:linear-gradient(135deg,#ff994b,#f66b27);color:#19110b;padding:22px;border-radius:22px;margin:15px 0}.hero h2{font-size:29px}.hero small{font-weight:700}.bar{background:#c55b24;height:8px;border-radius:9px;margin-top:14px;overflow:hidden}.bar span{display:block;height:100%;background:#201710}.card{background:#242426;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#a7a7ad;font-size:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.orange{color:#ff944a}.pill{background:#3b302a;border-radius:20px;padding:6px 10px;font-size:12px}.btn{background:#ff873d;color:#1a130e;border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#39393d;color:#f6f6f6}.btn.outline{background:transparent;color:#ff944a;border:1px solid #8a5738}.btn:disabled{opacity:.4}.btn.full{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}input,select{background:#333337;color:white;border:1px solid #49494e;border-radius:10px;padding:11px 8px;font-size:16px;max-width:100%}select{width:100%;margin:8px 0}input[type=number]{width:100%}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 62px;align-items:center;gap:9px;margin:9px 0}.setrow button{padding:12px 5px;border-radius:9px;border:1px solid #555;background:#36363a;color:white}.setrow button.done{background:#ff873d;color:#111;border-color:#ff873d}.sethead{font-size:11px;color:#999;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;border-top:1px solid #353538;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav>div{display:flex;width:100%;max-width:680px}.nav button{flex:1;background:none;color:#999;border:0;padding:14px 2px;font-size:12px}.nav button.active{color:#ff9348;font-weight:800}.hidden{display:none}.item{border-bottom:1px solid #3b3b3f;padding:12px 0}.item:last-child{border:0}.stat{background:#303034;padding:14px;border-radius:13px;flex:1;text-align:center}.stat strong{display:block;font-size:22px;color:#ff944a}.timer{font-size:38px;color:#ff944a;font-weight:800;font-variant-numeric:tabular-nums}.small{font-size:12px}textarea{width:100%;min-height:60px;background:#333;color:white;border:1px solid #555;border-radius:10px;padding:10px}.chart{width:100%;height:180px}.notice{font-size:12px;color:#b5b5b9;line-height:1.6}.demo-btn{margin:12px 0 8px;width:100%;background:#3a302b;border:1px solid #98603b;color:#ffa668;border-radius:12px;padding:12px;font-size:15px;font-weight:800}.demo-panel{background:#19191b;border:1px solid #49403a;border-radius:14px;padding:15px;margin:5px 0 14px;line-height:1.75}.demo-panel h3{color:#ff994d;margin:0 0 8px}.demo-panel p{margin:8px 0}.demo-panel .cue{color:#c6c6ca;font-size:13px}.demo-panel a{display:inline-block;color:#ffae78;margin-top:8px}.demo-panel[hidden]{display:none}</style></head><body><main><div class="top"><div class="eyebrow">FITLOG / TRAIN SMARTER</div><div style="font-size:25px">🏋️</div></div><h1>今天，练得更强。</h1><section id="today"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"></section><section id="jump" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav"><div id="nav"></div></nav><script>
const PLANS=[{name:'胸＋三头',items:[['平板杠铃卧推',5,'6–10',180],['上斜杠铃卧推',4,'8–12',180],['双杠臂屈伸／器械推胸',4,'8–12',120],['蝴蝶机夹胸',4,'10–15',90],['绳索三头下压',4,'10–15',90]]},{name:'肩＋腹',items:[['站姿杠铃实力举',4,'6–10',180],['哑铃推肩',4,'8–12',150],['哑铃侧平举',4,'12–15',90],['绳索面拉',4,'12–15',90],['蝴蝶机后束',4,'12–15',90],['悬垂举腿',4,'10–15',75]]},{name:'背＋二头',items:[['辅助引体向上',4,'6–10',150],['高位下拉',4,'8–12',120],['对握高位下拉',4,'8–12',120],['坐姿划船',4,'8–12',120],['胸托划船',4,'10–12',120],['哑铃弯举',4,'10–12',90]]},{name:'腿＋弹跳',items:[['助跑双脚摸高',3,'3',180],['史密斯深蹲',3,'5–8',180],['罗马尼亚硬拉',3,'8',150],['保加利亚分腿蹲',2,'8/侧',120],['髋内收机',2,'12–15',90],['站姿提踵',3,'10–15',90],['坐姿提踵',2,'12–20',90]]},{name:'休息日',items:[]}];
const DEMOS={
'助跑双脚摸高':['助跑 2–4 步，倒数第二步稍长，最后一步快速落地，双臂后摆再向上摆。双脚协同蹬地，伸髋、伸膝、踮脚，向最高点摸高。','每次全力起跳，落地时屈髋屈膝缓冲；组间休息 2–3 分钟。','不要为了追求次数而在疲劳状态下连续乱跳。'],
'原地反向纵跳':['双脚与肩同宽，站稳后快速下沉，手臂向后摆；立刻反向蹬地、摆臂向上跳。','下沉幅度自然，不必蹲到底；每次落地站稳再进行下一次。','避免膝盖内扣、落地僵硬。'],
'史密斯深蹲':['杠铃放在上背部，双脚放在能让下蹲自然的位置；吸气收紧核心，屈髋屈膝下蹲，再用全脚掌推地站起。','膝盖朝脚尖方向移动，下降到能稳定控制的深度。','不要脚跟离地、腰背失稳或强行蹲得过深。'],
'罗马尼亚硬拉':['双手握杠，膝盖微屈，臀部向后推，杠铃贴近双腿下移；感到大腿后侧拉伸后收臀站起。','保持脊柱自然稳定，重心落在全脚掌。','不是弯腰够地，也不要用腰部猛拉。'],
'保加利亚分腿蹲':['后脚脚背搭在长凳上，前脚踩稳；屈膝缓慢下降，前腿发力站起，两侧分别完成。','先徒手找到前后脚距离和身体平衡。','不要前膝明显内扣或靠后腿弹起。'],
'髋内收机':['坐稳并贴住靠背，把大腿置于腿垫内侧；控制双腿向中间夹紧，稍停，再缓慢打开。','选择能控制的重量，保持骨盆稳定。','不要用惯性猛夹或打开过度。'],
'站姿提踵':['前脚掌踩稳踏板，膝盖基本伸直；脚跟缓慢下降，再尽量抬高脚跟，顶端短暂停顿。','上下全程控制，不要借身体弹动。','不要只做很小的幅度。'],
'坐姿提踵':['坐姿屈膝约 90°，大腿放在腿垫下；前脚掌发力抬起脚跟，再慢慢下降。','顶端停顿，感受小腿深层发力。','不要反弹借力。'],
'平板杠铃卧推':['肩胛向后下收紧，双脚踩稳，杠铃有控制地下放至胸部附近，再向上推起。','手腕保持中立，杠铃路径稳定。','不要弹胸或抬臀。'],
'上斜杠铃卧推':['将卧推凳调至较小上斜角度，肩胛稳定，杠铃下放至上胸附近再推起。','避免肩膀耸起。','不要使用过大的倾斜角度。'],
'双杠臂屈伸／器械推胸':['双杠臂屈伸：身体略前倾，控制下降再推起；器械推胸：肩胛稳定，推柄向前推。','以肩部舒适的活动范围为准。','肩前侧疼痛时不要强撑。'],
'蝴蝶机夹胸':['调整座椅让把手与胸部大致齐平，手臂微屈，向前夹胸并控制回程。','胸部主动发力，肩膀不要前顶。','不要猛甩重量。'],
'绳索三头下压':['大臂贴近躯干，肘关节保持位置，向下伸直手臂，再慢慢还原。','控制回程，不要晃动身体。','不要用肩部和腰部借力。'],
'站姿杠铃实力举':['站稳、收紧核心，杠铃从上胸附近沿面前向上推至头顶，再控制下放。','顶端手臂伸直，避免腰部过度后仰。','不要蹬腿借力（实力举版本）。'],
'哑铃推肩':['坐姿或站姿，哑铃从肩侧向上推，控制下降。','肩胛自然上旋，动作范围以舒适为准。','不要猛撞哑铃或过度后仰。'],
'哑铃侧平举':['手肘微屈，哑铃沿身体两侧向上抬至肩高附近，再慢慢放下。','小重量控制，肩膀放松。','不要耸肩或甩腰。'],
'绳索面拉':['绳索调至面部高度，向额头附近拉，手肘向外打开，肩胛向后收。','动作缓慢，重视后肩和上背发力。','不要后仰借力。'],
'蝴蝶机后束':['面向器械坐稳，手臂略弯，向两侧打开，肩胛稳定。','感受三角肌后束发力。','不要用腰部摆动。'],
'悬垂举腿':['握住单杠，先稳定身体，卷起骨盆并抬腿，再控制下放。','可以先屈膝版本。','不要前后摆荡借力。'],
'辅助引体向上':['设置辅助重量，双手握杠，肩胛下沉，拉至下巴靠近横杠，再缓慢下降。','辅助越大越容易，优先保证动作幅度。','不要踢腿借力。'],
'高位下拉':['坐稳固定大腿，将握杆拉向上胸，肘部向身体两侧下方移动，控制还原。','躯干保持稳定。','不要猛然后仰。'],
'对握高位下拉':['使用对握把手，胸部挺起，将把手向上胸拉近，慢慢伸臂还原。','感受背阔肌发力。','不要只靠手臂拉。'],
'坐姿划船':['坐稳，背部自然挺直，先收肩胛，再将把手拉向腹部，控制向前伸展。','躯干轻微移动可以，但不要大幅摆动。','避免圆背猛拉。'],
'胸托划船':['胸部贴稳斜凳或器械胸垫，双臂向后拉，肘部沿合适轨迹移动。','避免借助腰背甩动。','不要耸肩。'],
'哑铃弯举':['手肘靠近躯干，弯曲肘部举起哑铃，再缓慢下放。','保持上臂稳定。','不要大幅摆腰。']};
function demoHtml(name){let d=DEMOS[name]||['保持动作稳定，在无痛范围内完成。','先用轻重量熟悉动作。','避免借力和动作失控。'];let q=encodeURIComponent(name+' 健身 动作教学');return `<button class="demo-btn" onclick="toggleDemo()">🎬 动作示范 / 要领 ▾</button><div class="demo-panel" id="demoPanel" hidden><h3>${esc(name)}</h3><p><b>① 动作步骤</b><br>${esc(d[0])}</p><p><b>② 关键提示</b><br>${esc(d[1])}</p><p class="cue"><b>⚠️ 常见错误</b><br>${esc(d[2])}</p><a target="_blank" rel="noopener noreferrer" href="https://www.bilibili.com/search?keyword=${q}">▶ 查找该动作的视频示范 ↗</a><p class="notice">视频链接需要网络；上方动作要领可离线查看。</p></div>`}
function toggleDemo(){let el=$('demoPanel');if(el)el.hidden=!el.hidden}
const DEFAULT={customNames:{},legPlanV3:false,day:0,exercise:0,sets:{},history:[],jumps:[],basketball:[],timerEnd:0,timerLeft:0,timerPaused:true};let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem('fitlog-v1')||'{}')}}catch(e){state={...DEFAULT}}// Keep existing leg-day set logs aligned when removing the second jump movement.
if(!state.legPlanV3){let migrated={};for(const [key,val] of Object.entries(state.sets||{})){let m=/^(w?3-)(\d+)$/.exec(key);if(m){let i=+m[2];if(i===1)continue;if(i>1){migrated[m[1]+(i-1)]=val;continue}}migrated[key]=val}state.sets=migrated;if(state.day===3&&state.exercise>1)state.exercise--;state.legPlanV3=true;localStorage.setItem('fitlog-v1',JSON.stringify(state))}
let tab='today';function save(){localStorage.setItem('fitlog-v1',JSON.stringify(state))}const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function exerciseName(day,index){return state.customNames?.[day+'-'+index]||PLANS[day].items[index][0]}
function renameExercise(){let key=state.day+'-'+state.exercise,old=exerciseName(state.day,state.exercise);let name=prompt('修改动作名称',old);if(name===null)return;name=name.trim();if(!name)return alert('动作名称不能为空');if(name.length>60)return alert('名称请控制在 60 字以内');state.customNames=state.customNames||{};state.customNames[key]=name;save();render()}
function resetExerciseName(){let key=state.day+'-'+state.exercise;if(!state.customNames?.[key])return;delete state.customNames[key];save();render()}
function currentRows(){let key=state.day+'-'+state.exercise,item=PLANS[state.day].items[state.exercise];return state.sets[key]||(state.sets[key]=Array.from({length:item[1]},()=>({weight:'',reps:'',done:false,warmup:false})))}function totalDone(){let d=0,t=0;PLANS[state.day].items.forEach((it,i)=>{let rows=state.sets[state.day+'-'+i]||Array.from({length:it[1]},()=>({done:false}));d+=rows.filter(x=>x.done).length;t+=rows.length});return[d,t]}
function drawNav(){let tabs=[['today','训练','🏋️'],['history','历史','📅'],['progress','成长','📈'],['jump','弹跳','🏀'],['settings','设置','⚙️']];$('nav').innerHTML=tabs.map(([id,name,icon])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')">${icon}<br>${name}</button>`).join('')};function switchTab(t){tab=t;['today','history','progress','jump','settings'].forEach(id=>$(id).classList.toggle('hidden',id!==t));render()}
function renderToday(){let plan=PLANS[state.day],done=totalDone();let html=`<div class="hero"><small>DAY 0${state.day+1} · TODAY'S WORKOUT</small><h2>${plan.name}</h2><div>${plan.items.length} 个动作 · 已完成 ${done[0]} / ${done[1]} 组</div><div class="bar"><span style="width:${done[1]?100*done[0]/done[1]:0}%"></span></div></div><div class="card"><div class="line"><h2>训练循环</h2><span class="pill">手动切换</span></div><select onchange="state.day=+this.value;state.exercise=0;save();render()">${PLANS.map((p,i)=>`<option value="${i}" ${state.day===i?'selected':''}>DAY 0${i+1} · ${p.name}</option>`).join('')}</select></div>`;
if(plan.items.length){let it=plan.items[state.exercise],rows=currentRows();html+=`<div class="card"><div class="line"><h2>动作记录</h2><span class="muted">${state.exercise+1}/${plan.items.length}</span></div><select onchange="state.exercise=+this.value;save();render()">${plan.items.map((x,i)=>`<option value="${i}" ${i===state.exercise?'selected':''}>${i+1}. ${esc(exerciseName(state.day,i))}</option>`).join('')}</select><div class="row" style="margin:8px 0 12px"><button class="btn secondary" onclick="renameExercise()">✏️ 修改动作名称</button><button class="btn outline" onclick="resetExerciseName()">恢复默认</button></div><div class="muted">${it[2]} 次/组 · 默认休息 ${it[3]} 秒 · 正式组</div>${demoHtml(it[0])}<div class="setrow sethead"><div>组</div><div>重量 kg</div><div>次数</div><div>完成</div></div>${rows.map((r,i)=>`<div class="setrow"><strong>${i+1}</strong><input aria-label="第${i+1}组重量" type="number" min="0" step="0.5" value="${esc(r.weight)}" onchange="editSet(${i},'weight',this.value)"><input aria-label="第${i+1}组次数" type="number" min="0" step="1" value="${esc(r.reps)}" onchange="editSet(${i},'reps',this.value)"><button class="${r.done?'done':''}" onclick="toggleSet(${i})">${r.done?'✓':'○'}</button></div>`).join('')}<div class="row"><button class="btn secondary" onclick="addSet()">＋ 增加组</button><button class="btn secondary" onclick="removeSet()">－ 减少组</button><button class="btn outline" onclick="addWarmup()">热身组</button></div><p class="notice">热身组单独记录，不计入正式组进度。</p><div id="warmups"></div><button class="btn full secondary" onclick="state.exercise=(state.exercise+1)%PLANS[state.day].items.length;save();render()">下一个动作 →</button></div><div class="card"><div class="line"><div><div class="muted">REST TIMER / 组间休息</div><div class="timer" id="timerText">00:00</div></div><button class="btn" id="timerBtn" onclick="pauseTimer()">${state.timerPaused?'▶ 继续':'⏸ 暂停'}</button></div><div class="row"><button class="btn secondary" onclick="adjustTimer(-30)">−30秒</button><button class="btn secondary" onclick="adjustTimer(30)">＋30秒</button><button class="btn outline" onclick="skipTimer()">跳过</button></div></div>`}else{html+='<div class="card">🌙 今天恢复体能，适当活动与休息。</div>'}html+=`<button class="btn full" onclick="finishDay()">完成今日安排 · 进入下一日 →</button>`;$('today').innerHTML=html;if(plan.items.length){drawWarmups();drawTimer()}}
function editSet(i,k,v){currentRows()[i][k]=v;save()}function toggleSet(i){let r=currentRows()[i];r.done=!r.done;if(r.done){let sec=PLANS[state.day].items[state.exercise][3];state.timerEnd=Date.now()+sec*1000;state.timerLeft=sec;state.timerPaused=false;if(i+1<currentRows().length&&!currentRows()[i+1].weight)currentRows()[i+1].weight=r.weight}save();render()}function addSet(){currentRows().push({weight:currentRows().at(-1)?.weight||'',reps:'',done:false});save();render()}function removeSet(){if(currentRows().length>1)currentRows().pop();save();render()}function addWarmup(){let key='w'+state.day+'-'+state.exercise;(state.sets[key]||(state.sets[key]=[])).push({weight:'',reps:''});save();drawWarmups()}function drawWarmups(){let key='w'+state.day+'-'+state.exercise,rows=state.sets[key]||[];$('warmups').innerHTML=rows.map((r,i)=>`<div class="setrow"><span class="small">热${i+1}</span><input type="number" placeholder="kg" value="${esc(r.weight)}" onchange="warmEdit(${i},'weight',this.value)"><input type="number" placeholder="次数" value="${esc(r.reps)}" onchange="warmEdit(${i},'reps',this.value)"><button onclick="removeWarm(${i})">删除</button></div>`).join('')}function warmEdit(i,k,v){state.sets['w'+state.day+'-'+state.exercise][i][k]=v;save()}function removeWarm(i){state.sets['w'+state.day+'-'+state.exercise].splice(i,1);save();drawWarmups()}
function leftTime(){return state.timerPaused?state.timerLeft:Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000))}function drawTimer(){let e=$('timerText');if(e){let s=leftTime();e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}let b=$('timerBtn');if(b)b.textContent=state.timerPaused?'▶ 继续':'⏸ 暂停'}function pauseTimer(){if(state.timerPaused&&state.timerLeft<=0)return;if(state.timerPaused){state.timerEnd=Date.now()+state.timerLeft*1000;state.timerPaused=false}else{state.timerLeft=leftTime();state.timerPaused=true}save();drawTimer()}function adjustTimer(v){let s=Math.max(0,leftTime()+v);state.timerLeft=s;state.timerEnd=Date.now()+s*1000;save();drawTimer()}function skipTimer(){state.timerLeft=0;state.timerPaused=true;save();drawTimer()}
function finishDay(){let plan=PLANS[state.day],snapshot={id:Date.now(),date:new Date().toISOString(),day:state.day,name:plan.name,items:plan.items.map((it,i)=>({name:exerciseName(state.day,i),sets:JSON.parse(JSON.stringify(state.sets[state.day+'-'+i]||[])),warmups:JSON.parse(JSON.stringify(state.sets['w'+state.day+'-'+i]||[]))}))};if(!confirm('保存本日记录并进入下一训练日？'))return;state.history.unshift(snapshot);Object.keys(state.sets).forEach(k=>{if(k.startsWith(state.day+'-')||k.startsWith('w'+state.day+'-'))delete state.sets[k]});state.day=(state.day+1)%5;state.exercise=0;save();render();switchTab('history')}
function renderHistory(){let h=`<h2>训练历史 / HISTORY</h2><p class="muted">完成今日安排后，训练数据会自动保存在这里。</p><div class="row"><div class="stat"><strong>${state.history.length}</strong><span class="small">累计训练日</span></div><div class="stat"><strong>${state.history.filter(x=>Date.now()-new Date(x.date).getTime()<7*86400000).length}</strong><span class="small">近7天</span></div></div>`;if(!state.history.length)h+='<div class="card">还没有历史记录。完成第一次训练后会显示在这里。</div>';state.history.forEach((r,i)=>{let sets=r.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0);h+=`<div class="card"><div class="line"><div><div class="orange small">${new Date(r.date).toLocaleDateString('zh-CN')}</div><h2>${esc(r.name)}</h2><span class="muted">已完成 ${sets} 组</span></div><button class="btn secondary" onclick="toggleDetail(${i})">查看详情</button></div><div id="detail${i}" class="hidden">${r.items.map(x=>`<div class="item"><b>${esc(x.name)}</b>${x.sets.filter(s=>s.done).map(s=>`<div class="muted">${esc(s.weight||'自重')} kg · ${esc(s.reps||'—')} 次</div>`).join('')||'<div class="muted">未完成</div>'}</div>`).join('')}</div></div>`});$('history').innerHTML=h}function toggleDetail(i){$('detail'+i).classList.toggle('hidden')}
function renderProgress(){let names=[...new Set(state.history.flatMap(h=>h.items.map(i=>i.name)))];$('progress').innerHTML=`<h2>力量成长 / PROGRESS</h2><p class="muted">根据真实完成的正式组，显示每次训练最高重量。</p>${names.length?`<select id="progressExercise" onchange="drawProgress()">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div id="progressChart" class="card"></div>`:'<div class="card">还没有数据。完成训练后将自动生成成长曲线。</div>'}`;if(names.length)drawProgress()}function drawProgress(){let name=$('progressExercise').value,pts=state.history.slice().reverse().map(h=>{let it=h.items.find(x=>x.name===name);let weights=(it?.sets||[]).filter(x=>x.done&&x.weight!=='').map(x=>Number(x.weight)).filter(Number.isFinite);return weights.length?{date:new Date(h.date).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}),v:Math.max(...weights)}:null}).filter(Boolean);if(!pts.length){$('progressChart').innerHTML='尚无有效重量记录';return}let max=Math.max(...pts.map(x=>x.v),1),min=Math.min(...pts.map(x=>x.v),0),range=Math.max(max-min,5);let coords=pts.map((p,i)=>`${30+(pts.length===1?140:i*280/(pts.length-1))},${150-(p.v-min)/range*115}`).join(' ');$('progressChart').innerHTML=`<div class="line"><div class="muted">最新 ${pts.at(-1).v} kg</div><b class="orange">${pts.at(-1).v-pts[0].v>=0?'+':''}${(pts.at(-1).v-pts[0].v).toFixed(1)} kg</b></div><svg class="chart" viewBox="0 0 340 180" role="img" aria-label="训练最高重量折线图"><line x1="20" y1="150" x2="325" y2="150" stroke="#777"/><polyline points="${coords}" fill="none" stroke="#ff873d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>{let x=30+(pts.length===1?140:i*280/(pts.length-1)),y=150-(p.v-min)/range*115;return `<circle cx="${x}" cy="${y}" r="4" fill="#ff873d"/><text x="${x}" y="${y-10}" font-size="10" text-anchor="middle" fill="white">${p.v}</text>`}).join('')}</svg><div class="muted">${pts.length} 次有重量记录的训练 · 单位 kg</div>`}
function renderJump(){$('jump').innerHTML=`<h2>JUMP LAB / 双脚弹跳</h2><div class="card"><div class="line"><span class="muted">身高</span><b>182 cm</b></div><div class="line"><span class="muted">主要起跳方式</span><b class="orange">双脚</b></div><div class="line"><span class="muted">当前参考</span><b>篮板下沿附近</b></div><div class="line"><span class="muted">目标</span><b>摸筐 → 扣篮</b></div></div><div class="card"><h2>记录摸高</h2><label class="muted">站立摸高（cm）</label><input id="reach" type="number" placeholder="尚未测量"><br><br><label class="muted">助跑摸高（cm）</label><input id="touch" type="number" placeholder="尚未测量"><button class="btn full" onclick="saveJump()">保存测量</button><p class="notice">只有实际测量后才计算弹跳高度；不使用篮板位置估算值作为成绩。</p></div><h2>摸高历史</h2>${state.jumps.map(x=>`<div class="card line"><div>${new Date(x.date).toLocaleDateString('zh-CN')}<div class="muted">站立 ${x.reach} cm · 助跑 ${x.touch} cm</div></div><b class="orange">弹跳 ${(+x.touch- +x.reach).toFixed(1)} cm</b></div>`).join('')||'<div class="card muted">暂无测量记录</div>'}<div class="card"><h2>篮球训练</h2><select id="ballType"><option>运球投篮</option><option>半场对抗</option><option>摸高训练</option></select><input id="ballMinutes" type="number" placeholder="时长（分钟）"><button class="btn full secondary" onclick="saveBall()">记录篮球训练</button>${state.basketball.slice(0,5).map(x=>`<div class="item muted">${new Date(x.date).toLocaleDateString('zh-CN')} · ${esc(x.type)} · ${x.minutes} 分钟</div>`).join('')}</div>`}function saveJump(){let r=+$('reach').value,t=+$('touch').value;if(!(r>0&&t>r&&t<450))return alert('请填写有效的站立摸高和助跑摸高');state.jumps.unshift({date:new Date().toISOString(),reach:r,touch:t});save();renderJump()}function saveBall(){let m=+$('ballMinutes').value;if(!(m>0&&m<1000))return alert('请输入训练分钟数');state.basketball.unshift({date:new Date().toISOString(),type:$('ballType').value,minutes:m});save();renderJump()}
function renderSettings(){$('settings').innerHTML=`<h2>设置 / SETTINGS</h2><div class="card"><h2>数据备份</h2><p class="muted">数据仅保存在当前设备浏览器本地。清理网站数据或卸载后可能丢失，请定期导出。</p><button class="btn full" onclick="exportData()">导出 JSON 备份</button><label class="btn secondary full" style="display:block;text-align:center;margin-top:10px">导入 JSON 备份<input style="display:none" type="file" accept="application/json,.json" onchange="importData(this)"></label></div><div class="card"><h2>使用说明</h2><p class="notice">训练日手动切换；完成组数会自动保存；点击「完成今日安排」后生成历史记录。计时器支持暂停和继续；动作名称可在训练页面单独修改并保存。浏览器后台提醒、振动及声音受设备限制。训练计划为参考模板，可根据恢复情况调整。</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FitLog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.history)||!Array.isArray(data.jumps)||!data.sets)throw Error('格式错误');if(confirm('导入将覆盖当前设备的 FitLog 记录，继续吗？')){state={...DEFAULT,...data};save();render();alert('导入成功')}}catch(e){alert('备份文件无效')}};reader.readAsText(f)}function render(){drawNav();renderToday();renderHistory();renderProgress();renderJump();renderSettings()}render();setInterval(()=>{drawTimer();if(!state.timerPaused&&leftTime()===0){state.timerPaused=true;state.timerLeft=0;save();if(navigator.vibrate)navigator.vibrate([150,100,150])}},1000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
