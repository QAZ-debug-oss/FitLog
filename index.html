const KEY='fitlog-v2';const E=[['bench','平板杠铃卧推','Barbell Bench Press','卧推架',4,'6–8',180,60,'胸大肌、肱三头肌',['肩胛后收并稳定','双脚踩稳，控制下放','推起时保持手腕稳定']],['incline','上斜杠铃卧推','Incline Barbell Press','卧推架',4,'8–10',120,45,'胸大肌上部、肱三头肌',['保持上斜凳角度适当','下放时肩胛稳定','不要弹起杠铃']],['pec','蝴蝶机夹胸','Pec Deck Fly','蝴蝶机',4,'10–12',90,35,'胸大肌',['调整座椅高度','手肘微屈','控制回放']],['rope','绳索下压','Rope Pushdown','绳索器械',4,'10–12',90,20,'肱三头肌',['上臂靠近身体','保持肩部稳定','伸肘下压并缓慢还原']],['press','站姿杠铃推举','Overhead Press','杠铃',4,'6–8',180,30,'三角肌、肱三头肌',['收紧核心','沿身体中线推起','避免腰部过度后仰']],['dpress','哑铃推肩','Dumbbell Shoulder Press','哑铃',4,'8–12',120,18,'三角肌',['保持躯干稳定','平稳推起','控制下放']],['lateral','哑铃侧平举','Lateral Raise','哑铃',4,'12–15',90,7.5,'三角肌中束',['肘部微屈','抬至肩高附近','避免甩腰借力']],['face','绳索面拉','Face Pull','绳索器械',4,'12–15',90,20,'三角肌后束、上背',['向额头方向拉','手肘向外打开','不要后仰借力']],['rear','蝴蝶机后束','Reverse Pec Deck','蝴蝶机',4,'12–15',90,25,'三角肌后束',['胸部贴稳靠垫','手臂向外打开','避免耸肩']],['legraise','悬垂举腿','Hanging Leg Raise','单杠',4,'10–15',60,0,'腹直肌',['先稳定悬垂','卷起骨盆抬腿','不要摆荡借力']],['pull','辅助引体向上','Assisted Pull-up','引体器械',4,'6–10',120,25,'背阔肌、肱二头肌',['肩胛先下沉','拉起时避免摆动','缓慢下降']],['lat','高位下拉','Lat Pulldown','高位下拉',4,'8–12',120,40,'背阔肌',['坐稳固定大腿','向上胸拉动','控制还原']],['neutral','对握高位下拉','Neutral Grip Pulldown','高位下拉',4,'8–12',120,40,'背阔肌',['保持胸部挺起','向上胸拉近','避免猛然后仰']],['row','坐姿划船','Seated Row','绳索器械',4,'8–12',120,40,'背阔肌、菱形肌',['保持脊柱稳定','向腹部拉动','控制前伸']],['chestrow','胸托划船','Chest Supported Row','划船器械',4,'10–12',120,30,'中背部',['胸部贴稳靠垫','向后拉动手肘','避免腰背甩动']],['curl','哑铃弯举','Dumbbell Curl','哑铃',4,'10–12',90,12,'肱二头肌',['上臂保持稳定','弯肘举起哑铃','缓慢放下']],['squat','史密斯机深蹲','Smith Squat','史密斯机',4,'6–10',180,60,'股四头肌、臀大肌',['脚掌稳定','膝盖朝脚尖方向','控制下蹲深度']],['rdl','罗马尼亚硬拉','Romanian Deadlift','杠铃',4,'8–10',150,50,'腘绳肌、臀大肌',['臀部向后推','保持脊柱稳定','杠铃贴近腿部']],['split','保加利亚分腿蹲','Bulgarian Split Squat','哑铃',4,'8–10',120,12,'股四头肌、臀大肌',['前脚踩稳','控制下降','两侧分别完成']],['adductor','髋内收机','Hip Adduction','髋内收机',4,'12–15',90,30,'大腿内收肌',['贴稳靠背','双腿平稳夹紧','缓慢打开']],['calf','站姿提踵','Standing Calf Raise','提踵机',4,'12–15',90,30,'小腿肌群',['前脚掌踩稳','顶端停顿','缓慢下降']],['jump','原地纵跳','Vertical Jump','弹跳',4,'3–5',180,0,'下肢爆发力',['充分热身','每次尽量高质量起跳','落地缓冲并充分休息']]];
const catalog=E.map(a=>({id:a[0],name:a[1],en:a[2],kind:a[3],sets:a[4],reps:a[5],rest:a[6],weight:a[7],muscle:a[8],tips:a[9]}));const get=id=>catalog.find(x=>x.id===id)||catalog[0];const defaultPlans=[{name:'四练一休',day:0,days:[{name:'胸＋三头',ids:['bench','incline','pec','rope']},{name:'肩＋腹',ids:['press','dpress','lateral','face','rear','legraise']},{name:'背＋二头',ids:['pull','lat','neutral','row','chestrow','curl']},{name:'腿',ids:['squat','rdl','split','adductor','calf','jump']},{name:'休息',ids:[]}]},{name:'上下肢训练',day:0,days:[{name:'上肢',ids:['bench','pull','press','row']},{name:'下肢',ids:['squat','rdl','calf']},{name:'休息',ids:[]}]}];
const initial=()=>({plans:structuredClone(defaultPlans),plan:0,history:[],settings:{unit:'kg',step:2.5,sound:true},measurements:[],recovery:null});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!db.plans?.length)db=initial()}catch{db=initial()};let tab='训练',page='home',detail=null,dialog=null,work=null,exIndex=0,selectedSet=0,rest=null,summaryNote='',historyId=null,historyEdit=null,historyDate='',historySearch='',historyMonth=new Date().getMonth(),historyYear=new Date().getFullYear(),statPage='home',pickerMode='add',pickerQuery='',planManage=false,noticeSaved=null,workStart=0,elapsed=0,lastActive=Date.now(),activeTime=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const activePlan=()=>db.plans[db.plan],day=()=>activePlan().days[activePlan().day],today=()=>day().ids.map(get),completed=e=>e.sets.filter(s=>s.done).length,finished=()=>work.filter(e=>!e.skipped&&e.sets.every(s=>s.done)).length,total=()=>work.reduce((n,e)=>n+completed(e),0);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('本机存储失败，请勿关闭页面');return false}};const toast=s=>{let e=$('toast');e.textContent=s;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2500)};const btn=(label,fn,cls='secondary')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;
function illustration(kind){let shape='';if(kind.includes('卧推'))shape='<path d="M14 19V64M66 19V64M10 63H27M53 63H70M15 26H65" stroke="#9ba0a9" stroke-width="4"/><path d="M26 49H54" stroke="#ff9855" stroke-width="8"/><path d="M39 51V65" stroke="#9ba0a9" stroke-width="4"/><circle cx="23" cy="26" r="7" fill="#ff9855"/><circle cx="57" cy="26" r="7" fill="#ff9855"/>';else if(kind.includes('哑铃'))shape='<path d="M12 40H68" stroke="#aeb3bc" stroke-width="5"/><rect x="16" y="26" width="12" height="28" rx="3" fill="#ff9855"/><rect x="52" y="26" width="12" height="28" rx="3" fill="#ff9855"/>';else if(kind.includes('绳索')||kind.includes('下拉'))shape='<path d="M21 66V13H59V66M21 20H59" stroke="#aeb3bc" stroke-width="4" fill="none"/><path d="M40 20V38L29 55M40 38L51 55" stroke="#ff9855" stroke-width="4" fill="none"/>';else if(kind.includes('蝴蝶'))shape='<path d="M17 65V17H63V65M17 20H63M30 29L17 47M50 29L63 47" stroke="#aeb3bc" stroke-width="4" fill="none"/><rect x="34" y="38" width="12" height="25" rx="3" fill="#ff9855"/>';else if(kind.includes('单杠')||kind.includes('引体'))shape='<path d="M13 16H67M18 16V66M62 16V66" stroke="#aeb3bc" stroke-width="4"/><path d="M32 30H48M40 30V50M40 50L30 64M40 50L50 64" stroke="#ff9855" stroke-width="5" fill="none"/>';else if(kind.includes('弹跳'))shape='<path d="M12 65H68" stroke="#aeb3bc" stroke-width="4"/><path d="M23 49L39 24L52 42L65 17" stroke="#ff9855" stroke-width="5" fill="none"/><path d="M56 17H65V26" stroke="#ff9855" stroke-width="4" fill="none"/>';else shape='<path d="M17 14V66M63 14V66M17 20H63M18 62H62" stroke="#aeb3bc" stroke-width="4"/><path d="M20 34H60" stroke="#c8cbd1" stroke-width="4"/><circle cx="25" cy="34" r="8" fill="#ff9855"/><circle cx="55" cy="34" r="8" fill="#ff9855"/>';return `<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="3" y="3" width="74" height="74" rx="12" fill="#34373d"/>${shape}</svg>`}
const thumb=(e,sm=false)=>`<div class="thumb ${sm?'sm':''}">${illustration(e.kind)}</div>`;const tutorial=(e)=>`<div class="row" style="margin-top:13px">${btn('▶ B站教学',`openTutorial('${e.id}','b')`,'secondary small grow')}${btn('抖音教学',`openTutorial('${e.id}','d')`,'secondary small grow')}</div>`;function openTutorial(id,platform){let name=get(id).name+' 健身 动作教学';let url=platform==='b'?'https://search.bilibili.com/all?keyword='+encodeURIComponent(name):'https://www.douyin.com/search/'+encodeURIComponent(name);window.open(url,'_blank','noopener,noreferrer')}
function exerciseDetail(e){return `<div class="details"><div class="row">${thumb(e,true)}<div><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.en)}</div></div></div><p>主要肌群：${esc(e.muscle)}</p><p>${e.sets} 组 × ${esc(e.reps)} 次 · 休息 ${e.rest} 秒</p><h3>动作要点</h3>${e.tips.map((x,i)=>`<p><span class="orange">${i+1}.</span> ${esc(x)}</p>`).join('')}${tutorial(e)}</div>`}
function header(name,side=''){return `<header class="head"><div><div class="brand">FITLOG</div><h1>${name}</h1></div>${side||'<span style="font-size:25px;color:#ff9855">◆</span>'}</header>`}
function nav(){return `<nav class="nav">${[['训练','▣'],['计划','▤'],['数据','▥'],['我的','◉']].map(([x,i])=>`<button class="${tab===x?'active':''}" onclick="goTab('${x}')"><span>${i}</span>${x}</button>`).join('')}</nav>`}
function home(){let p=activePlan(),d=day(),next=p.days[(p.day+1)%p.days.length];return header('今日训练')+(noticeSaved?`<div class="card" style="background:#303b34"><div class="row between"><b>✓ 本次训练已保存</b><button class="linkbtn" onclick="noticeSaved=null;render()">✕</button></div><p class="small">${noticeSaved.duration} 分钟 · ${noticeSaved.exercises} 个动作 · ${noticeSaved.sets} 组</p>${btn('查看本次训练记录',`openRecord(${noticeSaved.id})`,'secondary full small')}</div>`:'')+`<section class="card"><div class="row between tiny"><span class="muted">${esc(p.name)}</span><span class="orange">DAY ${p.day+1} / ${p.days.length}</span></div><div class="big">${esc(d.name)}</div><p class="muted small">${d.ids.length?d.ids.length+' 个计划动作':'休息日 · 无需打卡'}</p>${d.ids.length?btn('开始训练 →','beginWorkout()','full'):'<p class="notice">今天休息，不计为漏练。</p>'}<hr class="line"><button class="exercise" style="border:0" onclick="dialog='nextDay';render()"><div class="grow"><div class="tiny muted">下一训练日</div><b class="small">DAY ${(p.day+1)%p.days.length+1} · ${esc(next.name)}</b></div><span class="orange">切换 ›</span></button></section><section class="card"><div class="row between"><h2>今日全部动作</h2><span class="tiny muted">${d.ids.length} 个</span></div>${d.ids.length?today().map((e,i)=>`<button class="exercise" onclick="detail=detail==='${e.id}'?null:'${e.id}';render()">${thumb(e)}<span class="grow"><b class="small">${esc(e.name)}</b><div class="tiny muted">${e.sets} 组 × ${esc(e.reps)} 次</div><div class="tiny muted">休息 ${e.rest} 秒</div></span><span class="orange">${detail===e.id?'⌃':'⌄'}</span></button>${detail===e.id?exerciseDetail(e):''}`).join(''):'<p class="muted small">今天没有安排训练动作。</p>'}</section>`+nav()}
function beginWorkout(){if(db.recovery){dialog='recover';render();return}work=today().map(e=>({...structuredClone(e),skipped:false,sets:Array.from({length:e.sets},()=>({weight:e.weight,reps:parseInt(e.reps,10)||8,done:false}))}));exIndex=0;selectedSet=0;rest=null;summaryNote='';workStart=Date.now();elapsed=0;activeTime=true;page='workout';checkpoint();render()}

function restore(){let r=db.recovery;if(!r)return;work=r.work;exIndex=Math.min(r.exIndex,work.length-1);selectedSet=r.selectedSet||0;summaryNote=r.summaryNote||'';elapsed=r.elapsed||0;workStart=Date.now();activeTime=true;rest=r.rest;db.plan=r.plan??db.plan;activePlan().day=r.day??activePlan().day;dialog=null;page='workout';render()}

function copyForward(i){let e=work[exIndex],s=e.sets[i];e.sets.forEach((x,j)=>{if(j>i&&!x.done){x.weight=s.weight;x.reps=s.reps}});checkpoint();toast('已复制到后续未完成组');render()}
function workoutPage(){let e=work[exIndex];if(!e)return '';let pct=work.length?Math.round(finished()/work.length*100):0;return header('正在训练',btn('结束',"dialog='end';render()",'secondary small'))+`<section class="card"><div class="row between small"><b>${finished()} / ${work.length} 个动作完成</b><span class="muted">${total()} 组已完成</span></div><div class="progress" style="margin:12px 0 18px"><div style="width:${pct}%"></div></div><div class="row between"><button class="linkbtn" onclick="switchExercise(${exIndex-1})" ${exIndex===0?'disabled':''}>❮</button><button class="linkbtn" onclick="dialog='exerciseList';render()"><span class="orange">动作 ${exIndex+1} / ${work.length} ⌄</span><br><b style="color:white">${esc(e.name)}</b></button><button class="linkbtn" onclick="switchExercise(${exIndex+1})" ${exIndex===work.length-1?'disabled':''}>❯</button></div><div class="row" style="margin:15px 0">${thumb(e)}<div class="grow tiny muted">${e.sets.length} 组 · 目标 ${esc(e.reps)} 次<br>休息 ${e.rest} 秒</div>${btn('详情',"dialog='exerciseDetail';render()",'secondary small')}</div>${e.skipped?`<p class="orange">此动作已跳过，已完成组仍保留。</p>${btn('恢复动作',"work[exIndex].skipped=false;checkpoint();render()",'secondary full')}`:e.sets.map((s,i)=>`<div class="set ${s.done?'done':''}"><div class="row between"><b>第 ${i+1} 组</b><button class="check ${s.done?'on':''}" onclick="toggleDone(${i})">${s.done?'✓':'○'}</button></div><div class="setfields" style="margin-top:9px"><label>重量 (${db.settings.unit})<input class="field" inputmode="decimal" type="number" step="any" value="${s.weight}" onchange="setEdit(${i},'weight',this.value)"></label><label>次数<input class="field" inputmode="numeric" type="number" value="${s.reps}" onchange="setEdit(${i},'reps',this.value)"></label></div>${selectedSet===i?`<div class="quick"><button onclick="adjust(${i},'weight',-${db.settings.step})">−${db.settings.step}</button><button onclick="adjust(${i},'weight',${db.settings.step})">+${db.settings.step}</button><button onclick="adjust(${i},'reps',-1)">−1 次</button><button onclick="adjust(${i},'reps',1)">+1 次</button></div>${btn('复制到剩余未完成组',`copyForward(${i})`,'secondary small full')}`:`<button class="linkbtn tiny" onclick="selectedSet=${i};render()">快捷调整</button>`}</div>`).join('')}<div class="row" style="margin-top:15px">${btn('动作操作',"dialog='exerciseActions';render()",'secondary grow')}${btn(exIndex<work.length-1?'下一个动作 →':'查看总结',exIndex<work.length-1?`switchExercise(${exIndex+1})`:'toSummary()','grow')}</div></section>`+(rest?timerBar():'')}
function switchExercise(i){if(i<0||i>=work.length)return;exIndex=i;selectedSet=0;checkpoint();render()}
function timerRemaining(){return !rest?0:rest.paused?rest.left:Math.max(0,Math.ceil((rest.end-Date.now())/1000))}
function timerBar(){let n=timerRemaining();return `<div class="timer"><div class="row between"><div><b>⏱ 组间休息</b><div class="orange" style="font-size:20px;font-weight:700" id="timerText">${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}</div></div><div class="row">${btn(rest.paused?'继续':'暂停','toggleRest()','secondary small')}${btn('跳过','rest=null;checkpoint();render()','secondary small')}</div></div><div class="row between" style="margin-top:8px"><button class="linkbtn tiny" onclick="adjustRest(-15)">−15 秒</button><button class="linkbtn tiny" onclick="adjustRest(15)">+15 秒</button></div></div>`}
function toggleRest(){let left=timerRemaining();rest=rest.paused?{paused:false,left,end:Date.now()+left*1000}:{paused:true,left,end:0};checkpoint();render()}
function adjustRest(n){let left=Math.max(0,timerRemaining()+n);rest={paused:rest.paused,left,end:rest.paused?0:Date.now()+left*1000};checkpoint();render()}
function toSummary(){summaryNote=summaryNote||'';page='summary';checkpoint();render()}
function duration(){return Math.max(1,Math.round((elapsed+(activeTime?Date.now()-workStart:0))/60000))}
function summary(){let count=total(),valid=work.filter(e=>completed(e)>0);return header('训练总结')+`<section class="card"><h2>本次训练</h2><div class="grid2"><div class="stat"><span class="muted tiny">训练时长</span><strong>${duration()} 分钟</strong></div><div class="stat"><span class="muted tiny">完成动作</span><strong>${valid.length} 个</strong></div><div class="stat"><span class="muted tiny">完成组数</span><strong>${count} 组</strong></div></div><h3 style="margin-top:20px">动作明细（点击展开）</h3>${work.map((e,i)=>`<div class="record"><button class="exercise" style="padding:0;border:0" onclick="detail=detail===${i}?null:${i};render()"><span class="grow small">${esc(e.name)}</span><span class="tiny muted">${completed(e)} 组 ${detail===i?'⌃':'⌄'}</span></button>${detail===i?e.sets.filter(s=>s.done).map((s,j)=>`<p class="tiny muted">第 ${j+1} 组 · ${s.weight} ${db.settings.unit} × ${s.reps} 次</p>`).join('')||'<p class="tiny muted">未完成任何组</p>':''}</div>`).join('')}<label class="small muted">训练备注（可选）<textarea class="field" rows="3" oninput="summaryNote=this.value;checkpoint()">${esc(summaryNote)}</textarea></label><div class="stack" style="margin-top:15px">${btn('保存并返回','saveWorkout()','full')}${btn('返回训练修改',"page='workout';render()",'secondary full')}</div></section>`}
function saveWorkout(){let valid=work.filter(e=>completed(e));let record={id:Date.now(),date:new Date().toLocaleDateString('en-CA'),name:day().name,plan:activePlan().name,duration:duration(),sets:total(),exercises:valid.length,note:summaryNote,details:work.filter(e=>completed(e)||e.skipped).map(e=>({name:e.name,skipped:e.skipped,sets:e.sets.filter(s=>s.done).map(s=>({weight:s.weight,reps:s.reps}))}))};db.history.unshift(record);db.recovery=null;if(!save()){db.recovery={work,exIndex,selectedSet,summaryNote,elapsed:elapsed+Date.now()-workStart,rest,plan:db.plan,day:activePlan().day};return}noticeSaved=record;historyId=record.id;work=null;rest=null;page='home';render()}
function planPage(){let p=activePlan();return header('训练计划')+`<section class="card"><div class="row between"><h2>当前计划</h2>${btn('管理','planManage=!planManage;render()','secondary small')}</div><select class="field" onchange="db.plan=Number(this.value);detail=null;save();render()">${db.plans.map((x,i)=>`<option value="${i}" ${db.plan===i?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${planManage?`<div class="details stack">${btn('创建空白计划',"let n=prompt('新计划名称');if(n?.trim()){db.plans.push({name:n.trim(),day:0,days:[{name:'训练日 1',ids:[]}]});db.plan=db.plans.length-1;save();render()}",'secondary full')}${btn('复制当前计划',"let c=structuredClone(activePlan());c.name+='（副本）';db.plans.push(c);db.plan=db.plans.length-1;save();render()",'secondary full')}${btn('重命名当前计划',"let n=prompt('计划名称',activePlan().name);if(n?.trim()){activePlan().name=n.trim();save();render()}",'secondary full')}${btn('添加训练日',"let n=prompt('训练日名称','新训练日');if(n?.trim()){activePlan().days.push({name:n.trim(),ids:[]});save();render()}",'secondary full')}${btn('删除当前计划',"dialog='deletePlan';render()",'danger full')}</div>`:''}<p class="muted tiny">选择训练日（可横向滚动）</p><div class="tabs-scroll">${p.days.map((d,i)=>`<button class="day ${p.day===i?'active':''}" onclick="activePlan().day=${i};save();render()"><span class="orange tiny">DAY ${i+1}</span><div style="margin:8px 0"><b>${esc(d.name)}</b></div><span class="muted tiny">${d.ids.length} 个动作</span></button>`).join('')}</div></section><section class="card"><div class="row between"><h2>${esc(day().name)}</h2>${btn('重命名',"let n=prompt('训练日名称',day().name);if(n?.trim()){day().name=n.trim();save();render()}",'secondary small')}</div>${today().map((e,i)=>`<div class="exercise">${thumb(e,true)}<div class="grow"><b class="small">${esc(e.name)}</b><div class="tiny muted">${e.sets} 组 × ${esc(e.reps)} 次 · ${e.rest} 秒</div></div><button class="linkbtn" onclick="editPlanExercise(${i})">编辑</button><button class="linkbtn" onclick="removePlanExercise(${i})">✕</button></div>`).join('')||'<p class="muted small">当前训练日暂无动作。</p>'}<div class="stack" style="margin-top:14px">${btn('＋ 添加动作',"pickerMode='plan';pickerQuery='';dialog='picker';render()",'secondary full')}${p.days.length>1?btn('删除当前训练日',"dialog='deleteDay';render()",'ghost full'):''}</div><p class="notice">永久修改仅影响未来训练，不修改已保存的历史记录。</p></section>`+nav()}
function editPlanExercise(i){let e=get(day().ids[i]);let sets=prompt('正式组数',String(e.sets));if(sets===null)return;let reps=prompt('目标次数',e.reps);if(reps===null)return;let rest=prompt('休息秒数',String(e.rest));if(rest===null)return;let customId=e.id+'-custom-'+Date.now();catalog.push({...e,id:customId,sets:Math.max(1,Math.min(15,Number(sets)||e.sets)),reps:reps.trim()||e.reps,rest:Math.max(0,Number(rest)||e.rest)});db.custom=db.custom||[];db.custom.push(catalog[catalog.length-1]);day().ids[i]=customId;save();render()}

function dataPage(){let hist=db.history;return header('训练数据')+`<div class="grid2"><div class="stat"><span class="muted tiny">已记录训练</span><strong>${hist.length} 次</strong></div><div class="stat"><span class="muted tiny">累计完成组</span><strong>${hist.reduce((n,r)=>n+r.sets,0)} 组</strong></div><div class="stat"><span class="muted tiny">个人纪录</span><strong>PR</strong></div><div class="stat"><span class="muted tiny">训练天数</span><strong>${new Set(hist.map(r=>r.date)).size} 天</strong></div></div><section class="card" style="margin-top:13px"><h2>训练数据</h2>${[['calendar','▦','训练日历与历史'],['strength','↗','力量进步趋势'],['pr','★','个人纪录 PR'],['body','◎','身体与弹跳记录']].map(([id,ic,label])=>`<button class="exercise" onclick="statPage='${id}';render()"><span class="orange" style="font-size:21px">${ic}</span><b class="grow small">${label}</b><span class="muted">›</span></button>`).join('')}</section>${statPage==='calendar'?calendarPage():statPage==='strength'?strengthPage():statPage==='pr'?prPage():statPage==='body'?bodyPage():''}`+nav()}
function calendarPage(){let first=(new Date(historyYear,historyMonth,1).getDay()+6)%7,n=new Date(historyYear,historyMonth+1,0).getDate(),dates=db.history.filter(r=>(!historyDate||r.date===historyDate)&&(!historySearch||r.name.includes(historySearch)||r.details.some(x=>x.name.includes(historySearch))));return `<section class="card"><div class="row between">${btn('‹','changeMonth(-1)','secondary small')}<b>${historyYear} 年 ${historyMonth+1} 月</b>${btn('›','changeMonth(1)','secondary small')}</div><div class="calendar" style="margin:15px 0 5px">${['一','二','三','四','五','六','日'].map(x=>`<div class="tiny muted" style="text-align:center">${x}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:n},(_,i)=>{let d=`${historyYear}-${String(historyMonth+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="date ${historyDate===d?'selected':''}" onclick="historyDate=historyDate==='${d}'?'':'${d}';render()">${i+1}${db.history.some(r=>r.date===d)?'<span class="dot"></span>':''}</button>`}).join('')}</div><input class="field" placeholder="搜索训练日或动作" value="${esc(historySearch)}" oninput="historySearch=this.value;render()"><div class="row between" style="margin-top:15px"><h3>训练历史 ${historyDate?'· '+historyDate:''}</h3>${historyDate?btn('清除筛选',"historyDate='';render()",'secondary small'):''}</div>${dates.map(r=>`<button class="exercise" onclick="openRecord(${r.id})"><div class="grow"><b>${esc(r.name)}</b><div class="tiny muted">${r.date} · ${r.duration} 分钟 · ${r.sets} 组</div></div><span class="orange">›</span></button>`).join('')||'<p class="muted small">暂无符合条件的训练记录。</p>'}</section>`}
function changeMonth(d){historyMonth+=d;if(historyMonth<0){historyMonth=11;historyYear--}if(historyMonth>11){historyMonth=0;historyYear++}render()}
function strengthPage(){let values=[];for(let r of [...db.history].reverse())for(let e of r.details)for(let s of e.sets)if(Number.isFinite(Number(s.weight)))values.push({date:r.date,name:e.name,weight:Number(s.weight)});let names=[...new Set(values.map(x=>x.name))];let selected=detail&&names.includes(detail)?detail:names[0];let pts=values.filter(x=>x.name===selected);return `<section class="card"><h2>力量进步</h2><p class="muted small">根据实际完成组记录的最大重量展示，不计算训练容量。</p>${names.length?`<select class="field" onchange="detail=this.value;render()">${names.map(x=>`<option ${selected===x?'selected':''}>${esc(x)}</option>`).join('')}</select><div style="margin-top:14px">${plot(pts.map(x=>x.weight))}</div><p class="tiny muted">${pts.length} 条完成组记录</p>`:'<p class="muted">完成并保存训练后，这里会显示趋势。</p>'}</section>`}
function plot(v){if(!v.length)return '';let mx=Math.max(...v,1),mn=Math.min(...v,0),w=300,h=130;let points=v.map((x,i)=>`${20+(v.length===1?0:i/(v.length-1))*260},${110-(mx===mn?0.5:(x-mn)/(mx-mn))*90}`).join(' ');return `<svg class="chart" viewBox="0 0 300 140"><path d="M20 10V110H285" fill="none" stroke="#666"/><polyline points="${points}" fill="none" stroke="#ff9855" stroke-width="3" stroke-linejoin="round"/>${v.map((x,i)=>{let px=20+(v.length===1?0:i/(v.length-1))*260,py=110-(mx===mn?0.5:(x-mn)/(mx-mn))*90;return `<circle cx="${px}" cy="${py}" r="3" fill="#ff9855"/>`}).join('')}<text x="20" y="135" font-size="11" fill="#aaa">${mn}–${mx} ${db.settings.unit}</text></svg>`}
function prPage(){let map={};for(let r of db.history)for(let e of r.details)for(let s of e.sets){let old=map[e.name];if(!old||Number(s.weight)>old.weight||(Number(s.weight)===old.weight&&Number(s.reps)>old.reps))map[e.name]={weight:Number(s.weight),reps:Number(s.reps)}}return `<section class="card"><h2>个人纪录 PR</h2><p class="muted small">只统计已完成并保存的组数；编辑历史后自动重新计算。</p>${Object.entries(map).map(([name,x])=>`<div class="exercise"><b class="grow small">${esc(name)}</b><span class="orange">${x.weight} ${db.settings.unit} × ${x.reps}</span></div>`).join('')||'<p class="muted">暂无个人纪录。</p>'}</section>`}
function bodyPage(){let measurements=db.measurements||[];return `<section class="card"><h2>身体与弹跳记录</h2><div class="row"><select id="measureType" class="field"><option>体重 (kg)</option><option>站立摸高 (cm)</option><option>助跑摸高 (cm)</option><option>原地摸高 (cm)</option></select><input id="measureValue" class="field" type="number" step="any" placeholder="数值" style="max-width:95px"></div><div style="margin-top:10px">${btn('添加记录','addMeasurement()','full')}</div>${measurements.slice().reverse().map(x=>`<div class="exercise"><div class="grow"><b class="small">${esc(x.type)}</b><div class="tiny muted">${x.date}</div></div><span class="orange">${x.value}</span></div>`).join('')||'<p class="muted small">暂无记录。</p>'}</section>`}

function mePage(){return header('我的')+`<section class="card"><div class="row"><div class="thumb" style="font-size:25px;color:#ff9855">◉</div><div><b>我的 FitLog</b><p class="tiny muted">无需登录 · 仅本机保存</p></div></div><hr class="line"><div class="switch"><span>重量单位</span><select class="field" style="width:100px" onchange="db.settings.unit=this.value;save();render()"><option ${db.settings.unit==='kg'?'selected':''}>kg</option><option ${db.settings.unit==='lb'?'selected':''}>lb</option></select></div><div class="switch"><span>重量快捷调整</span><select class="field" style="width:100px" onchange="db.settings.step=Number(this.value);save();render()">${[.5,1,2.5,5].map(n=>`<option ${db.settings.step===n?'selected':''}>${n}</option>`).join('')}</select></div><label class="switch">休息结束声音提示 <input type="checkbox" ${db.settings.sound?'checked':''} onchange="db.settings.sound=this.checked;save()"></label><hr class="line">${[['分享 FitLog','share'],['支持开发者','support'],['反馈建议','feedback'],['关于 FitLog','about']].map(([x,id])=>`<button class="exercise" onclick="dialog='${id}';render()"><span class="grow">${x}</span><span class="orange">›</span></button>`).join('')}<p class="notice">本版本不提供账户、云同步、备份导入导出。清除网站数据可能永久删除记录。旧版 FitLog 数据保留在原存储键中，不会被本版覆盖，但不会自动显示在新版历史里。</p></section>`+nav()}
function openRecord(id){historyId=id;historyEdit=null;page='record';render()}
function recordPage(){let r=db.history.find(x=>x.id===historyId);if(!r)return header('未找到记录')+btn('返回',"page='home';render()",'secondary');let edit=historyEdit!==null,data=edit?historyEdit:r;return header('训练记录',btn('返回',"page='home';historyEdit=null;render()",'secondary small'))+`<section class="card"><div class="row between"><div><h2>${esc(data.name)}</h2><p class="tiny muted">${data.date}</p></div>${btn(edit?'保存':'编辑',edit?'saveRecordEdit()':'editRecord()','secondary small')}</div><p class="small muted">${data.duration} 分钟 · ${data.exercises} 个动作 · ${data.sets} 组</p>${data.details.map((e,i)=>`<div class="record"><b>${esc(e.name)}</b>${e.sets.map((s,j)=>`<div class="row between" style="margin-top:9px"><span class="tiny muted">第 ${j+1} 组</span>${edit?`<div class="row" style="max-width:205px"><input class="field" type="number" value="${s.weight}" onchange="historyEdit.details[${i}].sets[${j}].weight=Number(this.value)"><input class="field" type="number" value="${s.reps}" onchange="historyEdit.details[${i}].sets[${j}].reps=Number(this.value)"></div>`:`<span class="small">${s.weight} ${db.settings.unit} × ${s.reps} 次</span>`}${edit?`<button class="linkbtn" onclick="historyEdit.details[${i}].sets.splice(${j},1);render()">✕</button>`:''}</div>`).join('')}${edit?btn('＋ 添加组',`historyEdit.details[${i}].sets.push({weight:0,reps:8});render()`,'secondary small'):''}</div>`).join('')}<label class="small muted">备注${edit?`<textarea class="field" rows="3" onchange="historyEdit.note=this.value">${esc(data.note)}</textarea>`:`<p style="color:white">${esc(data.note||'暂无备注')}</p>`}</label>${edit?`<div class="stack">${btn('取消编辑',"historyEdit=null;render()",'secondary full')}${btn('删除本次记录',"dialog='deleteRecord';render()",'danger full')}</div>`:''}</section>`}

function saveRecordEdit(){historyEdit.sets=historyEdit.details.reduce((n,e)=>n+e.sets.length,0);historyEdit.exercises=historyEdit.details.filter(e=>e.sets.length).length;let i=db.history.findIndex(x=>x.id===historyId);db.history[i]=historyEdit;historyEdit=null;save();toast('历史修改已保存');render()}
function goTab(t){if(work){toast('请先结束或放弃当前训练');return}tab=t;page='home';detail=null;dialog=null;noticeSaved=null;render()}
function showOverlay(){if(!dialog)return '';let content='',footer=btn('关闭',"dialog=null;render()",'secondary full');if(dialog==='nextDay'){content=`<h2>切换训练日？</h2><p class="muted">${esc(day().name)} → ${esc(activePlan().days[(activePlan().day+1)%activePlan().days.length].name)}</p>${btn('确认切换',"activePlan().day=(activePlan().day+1)%activePlan().days.length;save();dialog=null;render()",'full')}`}else if(dialog==='end'){let inc=work.filter(e=>!e.skipped&&completed(e)<e.sets.length);content=`<h2>结束本次训练？</h2>${inc.length?`<p class="orange small">以下动作尚未完成：</p>${inc.map(e=>`<p class="small">${esc(e.name)} · ${completed(e)}/${e.sets.length} 组</p>`).join('')}`:''}<div class="stack">${btn('结束并查看总结',"dialog=null;toSummary()",'full')}${btn('放弃本次训练',"dialog='discard';render()",'danger full')}</div>`}else if(dialog==='discard'){content=`<h2>确认放弃训练？</h2><p class="muted small">本次未归档的记录会被清除，此操作不可撤销。</p>${btn('确认放弃','discard()','danger full')}`}else if(dialog==='recover'){content=`<h2>发现意外中断的训练</h2><p class="muted small">上次训练未正常结束，已保存的组数仍在本机。是否恢复？</p><div class="stack">${btn('恢复上次训练','restore()','full')}${btn('放弃恢复',"dialog='discardRecovery';render()",'secondary full')}</div>`}else if(dialog==='discardRecovery'){content=`<h2>放弃意外恢复？</h2><p class="muted">确认后将删除未归档的临时记录。</p>${btn('确认放弃',"db.recovery=null;save();dialog=null;render()",'danger full')}`}else if(dialog==='exerciseList'){content=`<h2>切换动作</h2>${work.map((e,i)=>`<button class="exercise" onclick="dialog=null;switchExercise(${i})"><span class="grow">${i+1}. ${esc(e.name)}</span><span class="orange tiny">${e.skipped?'已跳过':completed(e)+'/'+e.sets.length+' 组'}</span></button>`).join('')}`}else if(dialog==='exerciseDetail'){content=`<h2>动作详情</h2>${exerciseDetail(work[exIndex])}<p class="notice">查看详情不会暂停训练或休息计时。</p>`}else if(dialog==='exerciseActions'){content=`<h2>动作操作</h2><p class="notice">仅影响本次训练，不修改计划。</p><div class="stack">${btn('临时添加动作',"pickerMode='add';pickerQuery='';dialog='picker';render()",'secondary full')}${btn('临时替换动作',"pickerMode='replace';pickerQuery='';dialog='picker';render()",'secondary full')}${btn(work[exIndex].skipped?'恢复当前动作':'跳过当前动作',"work[exIndex].skipped=!work[exIndex].skipped;checkpoint();dialog=null;render()",'secondary full')}</div>`}else if(dialog==='picker'){let matches=catalog.filter(e=>e.name.includes(pickerQuery)||e.en.toLowerCase().includes(pickerQuery.toLowerCase()));content=`<h2>选择动作 · ${pickerMode==='plan'?'加入计划':pickerMode==='replace'?'临时替换':'临时添加'}</h2><input class="field" placeholder="搜索动作" value="${esc(pickerQuery)}" oninput="pickerQuery=this.value;renderOverlayOnly()"><div style="max-height:45dvh;overflow:auto">${matches.map(e=>`<button class="exercise" onclick="pickExercise('${e.id}')">${thumb(e,true)}<span class="grow small">${esc(e.name)}</span><span class="orange">＋</span></button>`).join('')||'<p class="muted">未找到动作</p>'}</div>`}else if(dialog==='deleteRecord'){content=`<h2>删除本次记录？</h2><p class="muted">删除后会重新计算个人纪录。</p>${btn('确认删除',"db.history=db.history.filter(r=>r.id!==historyId);save();historyEdit=null;page='home';dialog=null;render()",'danger full')}`}else if(dialog==='deletePlan'){content=`<h2>删除当前计划？</h2>${db.plans.length===1?'<p class="muted">至少需要保留一个计划。</p>':btn('确认删除',"db.plans.splice(db.plan,1);db.plan=0;save();dialog=null;render()",'danger full')}`}else if(dialog==='deleteDay'){content=`<h2>删除当前训练日？</h2>${btn('确认删除',"activePlan().days.splice(activePlan().day,1);activePlan().day=0;save();dialog=null;render()",'danger full')}`}else if(dialog==='share'){content=`<h2>分享 FitLog</h2><p class="small">https://qaz-debug-oss.github.io/FitLog/</p>${btn('复制链接',"navigator.clipboard?.writeText('https://qaz-debug-oss.github.io/FitLog/');toast('已复制');dialog=null;render()",'secondary full')}`}else if(dialog==='support'){content=`<h2>支持开发者</h2><p class="muted small">如果部署包中包含捐赠二维码，可通过项目现有支持页面使用。此新版不收集支付信息。</p>`}else if(dialog==='feedback'){content=`<h2>反馈建议</h2><p class="muted small">可以通过 GitHub 项目 Issues 提交建议。</p><a href="https://github.com/QAZ-debug-oss/FitLog/issues" target="_blank" rel="noopener">打开 GitHub Issues ↗</a>`}else if(dialog==='about'){content=`<h2>FitLog</h2><p class="muted small">离线优先的中文训练记录工具。无账号、无云同步；数据保存在当前设备浏览器中。</p><p class="tiny muted">设计整合版 · 2026-10</p>`}return `<div class="sheet" onclick="if(event.target===this){dialog=null;render()}"><div class="sheet-inner">${content}<div style="margin-top:14px">${footer}</div></div></div>`}
function renderOverlayOnly(){ $('overlay').innerHTML=showOverlay();let input=$('overlay').querySelector('input');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}
function pickExercise(id){let e=get(id);if(pickerMode==='plan'){day().ids.push(id);save()}else{let a={...structuredClone(e),skipped:false,sets:Array.from({length:e.sets},()=>({weight:e.weight,reps:parseInt(e.reps,10)||8,done:false}))};if(pickerMode==='replace'){let old=work[exIndex];if(completed(old)>0){old.skipped=true;work.splice(exIndex+1,0,a);exIndex++}else work.splice(exIndex,1,a)}else{work.push(a);exIndex=work.length-1}checkpoint()}dialog=null;render()}
function render(){if(db.custom){for(let e of db.custom)if(!catalog.some(x=>x.id===e.id))catalog.push(e)}let html=page==='workout'&&work?workoutPage():page==='summary'&&work?summary():page==='record'?recordPage():tab==='训练'?home():tab==='计划'?planPage():tab==='数据'?dataPage():mePage();$('app').innerHTML=html;$('overlay').innerHTML=showOverlay()}
function tick(){if(rest&&!rest.paused){let left=timerRemaining();let el=$('timerText');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){rest=null;if(db.settings.sound&&document.visibilityState==='visible'){try{navigator.vibrate?.(200)}catch{}}checkpoint();if(page==='workout')render()}}}
setInterval(tick,500);document.addEventListener('visibilitychange',()=>{if(!work)return;if(document.hidden){elapsed+=Date.now()-workStart;activeTime=false;checkpoint()}else{workStart=Date.now();activeTime=true;checkpoint()}});window.addEventListener('pagehide',()=>{if(work)checkpoint()});window.addEventListener('beforeunload',()=>{if(work)checkpoint()});if(db.recovery){dialog='recover'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
